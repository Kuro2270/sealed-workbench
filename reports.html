<!DOCTYPE html>
<html lang="ja" data-title="page.reports.title" data-desc="desc.reports">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set reports — MTG Arena Limited</title>
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MTG Arena Limited Workbench">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="./i18n.js"></script>
<script src="./analytics.js"></script>
<style>
  :root{
    --pine:#10304F; --pine-deep:#0A2038;
    --paper:#F5F8FC; --paper-2:#E8EEF6;
    --ink:#0D1B2A; --muted:#5C7185;
    --gold:#2F7DF6; --line:#D3DFEB;
    --w:#FAF4E2; --u:#7FB4D8; --b:#2C2833; --r:#DB8068; --g:#79A87F; --m:#C3A03B; --c:#C6CCC9;
    --hot:#1E7A52; --cold:#A24B32;
    --radius:8px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  /* 内容の長さでスクロールバーが出たり消えたりしても、位置が動かないようにする */
  html{overflow-y:scroll;scrollbar-gutter:stable}
  body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.8}
  h1,h2,h3{font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.2}

  header{background:linear-gradient(135deg,var(--pine-deep) 0%,var(--pine) 55%,#17466F 100%);color:var(--paper);padding:24px 24px 16px;border-bottom:3px solid var(--gold);box-shadow:0 10px 30px -18px rgba(8,26,48,.9)}
  .wrap{max-width:1180px;margin:0 auto}
  .head-top{display:block}
  .brand{font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;font-size:17px;font-weight:700;letter-spacing:.04em;color:#9CC8FF;line-height:24px;margin:0 0 12px}

  /* 言語の切り替えは、どのページでも見出しの右上に置く */
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
  .brandrow .brand{margin:0}
  select.langsel{min-width:112px;padding:6px 10px;font-size:13px}
  header h1{font-size:24px;margin:0}
  header p{margin:6px 0 0;color:#A9C2DE;font-size:13px;line-height:1.55;max-width:80ch;min-height:41px}
  nav{margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px}
  nav a{
    display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;
    font-size:13px;font-weight:500;line-height:1;white-space:nowrap;
    color:#C6D9EE;text-decoration:none;background:rgba(255,255,255,.05);
    border:1px solid #2C4D74;transition:background .12s,color .12s;
  }
  nav a:hover{background:#1A4A79;color:var(--paper);border-color:#2F5E8F}
  nav a.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF;font-weight:700}

  /* ナビはカテゴリごとにまとめる。小さな見出しを付けて、探す場所を分かりやすくする */
  nav{margin:0 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
  .ng{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:16px;border-left:1px solid rgba(255,255,255,.16)}
  .ng:first-of-type{padding-left:0;border-left:none}
  .ng{position:relative;padding-top:17px}
  .ng:has(.ngs){padding-top:35px}
  .ngl{position:absolute;left:16px;top:0;white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#8FA9C6;text-transform:uppercase}
  .ng:first-of-type .ngl,.ng:first-of-type .ngs{left:0}
  .ngs{position:absolute;left:16px;top:17px;white-space:nowrap;font-size:11px;color:#8FA9C6;line-height:1.3}
  nav a .pcb{display:inline-block;margin-left:6px;padding:0 5px;border-radius:6px;font-size:9.5px;font-weight:700;letter-spacing:.06em;line-height:16px;vertical-align:1px;background:rgba(255,255,255,.14);color:#CFE3FA}
  nav a.on .pcb{background:rgba(255,255,255,.28);color:#fff}
  @media (max-width:760px){
    .ng{padding-left:0;border-left:none;width:100%} .ngl,.ngs{left:0}
  }
  .controls{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select{background:var(--pine-deep);color:var(--paper);border:1px solid #2C4D74;padding:9px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px;min-width:190px}
  /* セット名が入る前後で幅が動かないよう固定する */
  #setSelect{width:300px}

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  main{max-width:900px;margin:0 auto;padding:22px 24px 70px}
  /* 記事内の形式切り替え */
  /* 形式の切り替えタブ */
  .tabs{display:inline-flex;gap:3px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .tab{background:transparent;border:none;border-radius:999px;padding:8px 22px;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.4}
  .tab:hover:not(:disabled):not(.on){color:var(--ink);background:#fff}
  .tab.on{background:var(--pine);color:var(--paper)}
  .tab:disabled{opacity:.38;cursor:not-allowed}
  .modebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .modebar .lbl{font-size:13px;color:var(--muted)}
  .modebar select{background:#fff;color:var(--ink);border:1px solid var(--line);min-width:150px;padding:8px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px}

  .status{padding:14px 16px;background:var(--paper-2);border-left:3px solid var(--muted);font-size:14px;color:var(--muted);margin-bottom:8px}
  .status.preview{border-left-color:var(--gold);color:var(--ink)}
  /* 下見（固定ページの本文を差し込んだもの） */
  .profile .dot{display:inline-block;margin-right:6px;vertical-align:-1px}
  .profile td.num,.profile th.num{text-align:right}
  .profile td{text-align:left}
  .profile .rar{font-size:11px;border-radius:2px;padding:1px 5px;font-weight:700;color:#fff;background:#2A3B4C;margin-right:6px}
  .profile .rar.uncommon{background:#8496A0}.profile .rar.rare{background:var(--gold)}.profile .rar.mythic{background:#C4552C}
  .profile svg{max-width:100%;height:auto}
  .profile .cn{border-bottom:1px dotted var(--line);cursor:default}
  .profile .mana{display:inline-flex;gap:2px;vertical-align:middle}
  .profile .ms{width:16px;height:16px;display:block}
  .profile .ctabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .profile .ctab{font:inherit;font-size:13.5px;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
  .profile .ctab.on{background:var(--navy, #0F2A44);color:#fff;border-color:var(--navy, #0F2A44)}
  .profile .ctab .dot{display:inline-block;margin-right:5px}
  .profile .grp{margin:0 0 18px;border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px;background:#fff}
  .profile .grp[hidden]{display:none}
  .profile .grp h4{margin:12px 0 4px;font-size:13px}
  .profile .grp small{color:var(--muted);font-weight:400}
  .profile table.cards td{padding:4px 6px;text-align:left}
  .profile table.cards td.cost{width:96px;white-space:nowrap}
  .profile table.cards td.type{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .profile table.cards td.num{width:48px;text-align:right}
  .profile .tag{font-size:10.5px;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
  @media (max-width:640px){ .profile table.cards td.type{display:none} .profile small.en{display:none} }
  .profile small.en{color:var(--muted);margin-left:6px}
  /* 読み込み中を示す回転 */
  .status.busy{display:flex;align-items:center;gap:10px}
  .status.busy::before{
    content:"";flex:none;width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(15,28,23,.18);border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .status.busy::before{animation-duration:2.4s} }
  .status.err{border-left-color:#B4432E;color:#8A3422;background:#F6E9E5}
  .built{font-size:12px;color:var(--muted);margin:0 0 22px}
  .video{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin:0 0 22px}
  .video .yt{position:relative;width:min(240px,100%);aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#0A2038;flex:none}
  .video .yt img{width:100%;height:100%;object-fit:cover;display:block}
  .video .yt button{position:absolute;inset:0;width:100%;height:100%;border:0;background:rgba(10,32,56,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .video .yt button span{width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .video .yt button span::after{content:"";border-left:20px solid #0B1E33;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
  .video .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video .vtext{flex:1 1 240px;min-width:0}
  .video .vtext h3{margin:0 0 4px;font-size:16px}
  .video .vtext p{margin:0 0 8px;color:var(--muted);font-size:13px}
  .video .vtext a{font-size:13px}

  section{margin-bottom:36px}
  h2{font-size:19px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .lead{font-size:13.5px;color:var(--muted);margin:0 0 14px}
  .verdict{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--radius);padding:13px 16px;margin-bottom:14px;font-size:14.5px}
  /* 表示件数の切り替え */
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
  .chips .lbl{font-size:12.5px;color:var(--muted);margin-right:4px}
  .chip{font:inherit;font-size:12.5px;line-height:1;padding:7px 13px;border-radius:999px;cursor:pointer;
        background:#fff;color:var(--ink);border:1px solid var(--line)}
  .chip:hover{border-color:var(--gold)}
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
  .verdict .gap{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}

  /* 横棒グラフ */
  .bars{display:grid;gap:7px}
  .bar{display:grid;grid-template-columns:150px 1fr 62px 78px;gap:10px;align-items:center;font-size:13.5px}
  .bar .track{height:20px;background:var(--paper-2);border-radius:3px;overflow:hidden}
  .bar .track i{display:block;height:100%;background:var(--pine);border-radius:3px}
  .bar .track i.hot{background:var(--hot)}
  .bar .track i.cold{background:var(--cold)}
  .bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .bar .n{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar .lbl{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(15,28,23,.22)}
  @media (max-width:620px){ .bar{grid-template-columns:96px 1fr 54px} .bar .n{display:none} }


  /* カード表 */
  .rar-group{margin-bottom:22px}
  .rar-group h3{font-size:15px;margin:0 0 6px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{text-align:right;font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
  th:first-child{text-align:left}
  td{padding:5px 8px;border-bottom:1px solid var(--paper-2);text-align:right;font-size:13.5px}
  td:first-child{text-align:left}
  tbody tr:hover{background:var(--paper-2)}
  .cname{display:flex;align-items:center;gap:7px}
  .cname .nm{border-bottom:1px dotted var(--line);cursor:default}
  .wr.hot{color:var(--hot);font-weight:700}
  .wr.cold{color:var(--cold)}
  .thin{color:var(--muted);font-size:12px}

  .notes{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
  .notes p{margin:0 0 10px}
  .notes p:last-child{margin:0}

  #preview{position:fixed;z-index:50;pointer-events:none;display:none;filter:drop-shadow(0 10px 24px rgba(15,28,23,.35))}
  #preview img{display:block;width:244px;height:auto;border-radius:11px}

  footer{max-width:900px;margin:0 auto;padding:0 24px 50px;color:var(--muted);font-size:11.5px;line-height:1.9}
  footer a{color:var(--muted)}

  /* ---------- スマートフォン ---------- */
  @media (max-width:720px){
    header p{min-height:0}
    html,body{overflow-x:hidden}
    body{font-size:14px}
    header{padding:16px 14px 12px}
    header h1{font-size:20px}
    header p{font-size:12px;max-width:none}
    main{padding:16px 14px 50px}
    footer{padding:0 14px 40px}
    .head-top{flex-direction:column;align-items:stretch;gap:12px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .controls select{min-width:0;width:100%}
    #setSelect{width:100%}
    .controls > select:first-of-type{grid-column:1 / -1}
    nav{margin:0 0 14px;gap:6px;font-size:12px}
    nav a{white-space:nowrap}
    #preview{display:none !important}
    #preview.tap{display:block !important}
  }
  /* スマホのタップ表示：画面中央に出し、後ろに膜を敷く */
  #preview.tap{display:block;left:50% !important;top:50% !important;transform:translate(-50%,-50%);pointer-events:auto}
  #preview.tap img{width:min(300px, 78vw)}
  #tapdim{display:none;position:fixed;inset:0;z-index:49;background:rgba(15,28,23,.55)}
  #tapdim.on{display:block}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="brand" data-i18n="site.name">MTGアリーナ リミテッド・ワークベンチ</div>
      <select id="langSelect" class="langsel" data-i18n-label="lang.label"><option value="ja">日本語</option><option value="en">English</option></select>
    </div>
    <nav>
      <div class="ng"><span class="ngl" data-i18n="navgrp.start">はじめに</span>
        <a href="./start/index.html" data-start-link data-i18n="nav.start">はじめての方へ</a>
        <a href="./guide.html" data-i18n="nav.guide">使い方</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.build">練習する</span><span class="ngs" data-i18n="navsub.build">仮想パックで練習</span>
        <a href="./" data-i18n="nav.sealed">シールド練習</a>
        <a href="./draft.html" data-i18n="nav.draft">ドラフト練習</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.assist">MTGアリーナで使う</span><span class="ngs" data-i18n="navsub.assist">実戦のログを読んで助ける・PC専用</span>
        <a href="./sealed-assist.html"><span data-i18n="nav.sassist">シールド補助</span><b class="pcb" data-i18n="nav.pc">PC</b></a>
        <a href="./assistant.html"><span data-i18n="nav.assist">ドラフト補助</span><b class="pcb" data-i18n="nav.pc">PC</b></a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.data">データを見る</span>
        <a href="./reports.html" class="on" data-i18n="nav.reports">環境レポート</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.play">対戦する</span>
        <a href="./table.html" data-i18n="nav.table">対戦卓</a>

    <div class="ng"><span class="ngl" data-i18n="navgrp.shop">買う</span>
        <a href="./goods/index.html" data-goods-link data-i18n="nav.goods">日本のサプライ</a></div>

    <div class="head-top">
      <div>
        <h1 data-i18n="reports.h1">環境レポート</h1>

        <select id="setSelect" data-i18n-label="sel.set"><option value="">…</option></select>
      </div>

</header>

<main>
  <div class="modebar">
    <div class="tabs" id="modeTabs" role="tablist">
      <button type="button" class="tab on" role="tab" aria-selected="true"  data-mode="draft"  data-i18n="mode.draft">ドラフト</button>
      <button type="button" class="tab"    role="tab" aria-selected="false" data-mode="sealed" data-i18n="mode.sealed">シールド</button>
    </div>
  </div>

  <div id="status" class="status" data-i18n="reports.ready">セットと形式を選んでください。</div>

<div id="tapdim" aria-hidden="true"></div>

<div id="goodsStrip"></div>

  <span data-i18n-html="foot.short">データの出典・権利表示、および当サイトの内容を引用する際のお願いは<a href="./privacy.html">プライバシーポリシー</a>にまとめています。</span>
</footer>

<script>
const SCRY = "https://api.scryfall.com";
const COLORS = [
  {key:"W", var:"--w"}, {key:"U", var:"--u"}, {key:"B", var:"--b"},
  {key:"R", var:"--r"}, {key:"G", var:"--g"}
];
const RARITIES = ["mythic", "rare", "uncommon", "common"];
const MIN_GAMES = 500;

let index = [], speedIndex = null, report = null, jaMap = {}, nameMap = {};
/* レアリティごとに何枚まで出すか。0 はすべて。選んだ値はこのブラウザに残す */
let topN = 10;
try{ const v = parseInt(localStorage.getItem("sw.reports.topn"), 10); if(v === 10 || v === 30 || v === 0) topN = v; }catch(e){}
const fullCache = {};        // セット×形式ごとの全カード（上位30・すべてのときだけ読む）
let mode = "draft";         // 表示中の形式（ドラフト／シールド）
const repCache = {};         // セット×形式ごとの記事。タブの切り替えを即時にする
let mapsFor = null;          // 日本語名・画像の取得済みセット（言語つき）

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => (s || "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";

function setStatus(msg, isErr, busy){
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "") + (busy ? " busy" : "");
}

/* ---------- 一覧の読み込み ---------- */
async function loadIndex(){
  try{
    const res = await fetch("./data/articles/index.json", {cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    index = j.articles || [];
    speedIndex = j.speed || null;
    // 下見だけのセット（勝率データ待ち）も選べるようにする
    try{
      const pr = await fetch("./data/profiles/index.json", {cache:"no-cache"});
      if(pr.ok){ const pj = await pr.json(); profileOnly = (pj.profiles || []).map(x => x.set).filter(c => !index.some(a => a.set === c)); profileRel = Object.fromEntries((pj.profiles || []).map(x => [x.set, x.released_at || ""])); }
    }catch(e){}
    renderSetOptions();
    const want = new URLSearchParams(location.search).get("set");
    if(want && [...$("setSelect").options].some(o => o.value === want.toUpperCase())) $("setSelect").value = want.toUpperCase();
    updateModeTabs();
    syncStaticLink();
    if(index.length) load();
  }catch(e){
    setStatus(t("reports.none"), true);
  }
}

let profileOnly = [], profileRel = {};
function renderSetOptions(){
  const sel = $("setSelect"), keep = sel.value;

  // 発売日の新しい順（他のページと同じ並び）。発売日が無いものは後ろに回す。
  const rel = {};
  index.forEach(a => { if(a.released_at && !rel[a.set]) rel[a.set] = a.released_at; });
  profileOnly.forEach(c => { if(profileRel[c]) rel[c] = profileRel[c]; });
  const sets = [...new Set([...index.map(a => a.set), ...profileOnly])]
    .sort((x, y) => (rel[y] || "").localeCompare(rel[x] || "") || x.localeCompare(y));

  sel.innerHTML = "";
  sets.forEach(code => {
    const o = document.createElement("option");
    o.value = code;
    o.textContent = I18N.setName(code, code) + "（" + code + "）" + "";
    sel.appendChild(o);
  });
  if(keep && sets.includes(keep)) sel.value = keep;
}

/* 選んだセットで用意のある形式だけを押せるようにする */
function updateModeTabs(){
  const code = $("setSelect").value;
  const modes = index.filter(a => a.set === code).map(a => a.mode);
  let first = null;
  document.querySelectorAll("#modeTabs .tab").forEach(b => {
    b.disabled = modes.length > 0 && !modes.includes(b.dataset.mode);
    if(!b.disabled && first === null) first = b.dataset.mode;
  });
  if(first && !modes.includes(mode)) mode = first;
  syncModeTabs();
}

/* タブの見た目を今の形式に合わせる */
function syncModeTabs(){
  document.querySelectorAll("#modeTabs .tab").forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", String(on));
  });
}

/* ---------- 日本語カード名・画像 ---------- */
async function loadCardMaps(code){
  jaMap = {}; nameMap = {};
  if(!I18N.isJa()){
    // 英語表示でも画像は出したいので、英語版だけ取る
    try{
      let url = SCRY + "/cards/search?q=" + encodeURIComponent("set:" + code) + "&unique=prints";
      while(url){
        const res = await fetch(url);
        if(!res.ok) break;
        const d = await res.json();
        d.data.forEach(c => namesOf(c).forEach(n => {
          if(!nameMap[n]) nameMap[n] = { imgs: imgsOf(c) };
        }));
        url = d.has_more ? d.next_page : null;
        if(url) await sleep(120);
      }
    }catch(e){ nameMap = {}; }
    return;
  }

  try{
    const keyOf = {};
    let url = SCRY + "/cards/search?q=" + encodeURIComponent("set:" + code) + "&unique=prints";
    while(url){
      const res = await fetch(url);
      if(!res.ok) break;
      const d = await res.json();
      d.data.forEach(c => {
        const k = c.set + "/" + c.collector_number;
        namesOf(c).forEach(n => {
          if(!nameMap[n]) nameMap[n] = { imgs: imgsOf(c) };
          if(!keyOf[n]) keyOf[n] = k;
        });
      });
      url = d.has_more ? d.next_page : null;
      if(url) await sleep(120);
    }

    const byKey = {};
    url = SCRY + "/cards/search?q=" + encodeURIComponent("set:" + code + " lang:ja")
        + "&unique=prints&include_multilingual=true";
    while(url){
      const res = await fetch(url);
      if(!res.ok) break;
      const d = await res.json();
      d.data.forEach(c => {
        if(c.lang !== "ja") return;
        const k = c.set + "/" + c.collector_number;
        if(byKey[k]) return;
        const faces = Array.isArray(c.card_faces) ? c.card_faces.map(f => f.printed_name).filter(Boolean) : [];
        byKey[k] = { name: c.printed_name || faces.join(" // "), front: faces[0] || c.printed_name || "", imgs: imgsOf(c) };
      });
      url = d.has_more ? d.next_page : null;
      if(url) await sleep(120);
    }

    Object.entries(keyOf).forEach(([n, k]) => { if(byKey[k]) jaMap[n] = byKey[k]; });
  }catch(e){ jaMap = {}; }
}

function namesOf(c){
  const out = [c.name];
  if(c.name.includes(" // ")) out.push(c.name.split(" // ")[0].trim());
  if(Array.isArray(c.card_faces)) c.card_faces.forEach(f => { if(f.name) out.push(f.name); });
  return [...new Set(out.filter(Boolean))];
}

function imgsOf(c){
  if(c.image_uris?.normal) return [c.image_uris.normal];
  if(Array.isArray(c.card_faces)) return c.card_faces.map(f => f.image_uris?.normal).filter(Boolean);
  return [];
}

function displayName(name){
  const j = I18N.isJa() && jaMap[name];
  if(!j) return name;
  return (j.front && !name.includes(" // ")) ? j.front : (j.name || name);
}

function imageUrls(name){
  const j = I18N.isJa() && jaMap[name];
  if(j && j.imgs && j.imgs.length) return j.imgs;
  return (nameMap[name] && nameMap[name].imgs) || [];
}

/* ---------- 本体の読み込み ---------- */
async function load(){
  const code = $("setSelect").value;
  if(!code || !mode) return;
  const key = code + "_" + mode;

  // 一度読んだ組み合わせは覚えておき、タブの切り替えで待たせない
  if(repCache[key] && mapsFor === code + ":" + I18N.lang){
    report = repCache[key];
    render();
    return;
  }

  $("body").hidden = true; if($("video")) $("video").hidden = true;
  setStatus(t("reports.loading"), false, true);

  try{
    let r = repCache[key];
    if(!r){
      const res = await fetch(`./data/articles/${key}.json`, {cache:"no-cache"});
      if(!res.ok){ if(!(await showProfile(code))){ setStatus(t("reports.none"), true); } return; }
      r = await res.json();
      repCache[key] = r;
    }
    report = r;
    if(mapsFor !== code + ":" + I18N.lang){
      await loadCardMaps(code);
      mapsFor = code + ":" + I18N.lang;
    }
    render();
  }catch(e){
    setStatus(t("reports.none"), true);
  }
}

/* 上位30・すべてを出すときは、全カードの勝率ファイルを読む（トップ10は記事の中に入っている） */
async function loadFull(){
  const key = $("setSelect").value + "_" + mode;
  if(fullCache[key]) return fullCache[key];
  const res = await fetch(`./data/ratings/${key}.json`, {cache:"no-cache"});
  if(!res.ok) throw new Error("no data");
  const d = await res.json();
  // 記事のトップ10と同じ条件でそろえる（土地を除き、試合数が少ないものは外す）
  const list = (d.cards || []).filter(c => !c.land && c.gih != null && c.games >= MIN_GAMES)
                              .sort((a, b) => b.gih - a.gih);
  fullCache[key] = list;
  return list;
}
/* そのレアリティで出すカードの一覧 */
function cardsOf(rarity){
  if(topN === 10) return report.top?.[rarity] || [];
  const key = $("setSelect").value + "_" + mode;
  const all = (fullCache[key] || []).filter(c => c.rarity === rarity);
  return topN === 0 ? all : all.slice(0, topN);
}

/* ---------- 描画 ---------- */
/* ゲームの長さ（平均ターン数）を直近セットと比べて1文にする。「速い／遅い環境」は言わない（環境の速さは verdict が決める） */
function paceLine(){
  if(!speedIndex || !report) return "";
  const grp = speedIndex[report.mode];
  if(!grp || grp.average == null) return "";
  const mine = (grp.sets || []).find(x => x.set === report.set)?.avg_turns ?? report.avg_turns;
  if(mine == null) return "";
  const diff = mine - grp.average;
  const key = Math.abs(diff) < 0.15 ? "same" : (diff < 0 ? "fast" : "slow");
  return ` ${t("reports.pace." + key, {n: mine.toFixed(1), c: grp.count || (grp.sets || []).length})}`;
}

function barRow(label, wr, games, cls, dotVar){
  const w = wr == null ? 0 : Math.max(2, ((wr - 0.45) / 0.20) * 100);   // 45%〜65%を横幅に割り当てる
  return `<div class="bar">
    <span class="lbl">${dotVar ? `<span class="dot" style="background:var(${dotVar})"></span>` : ""}${esc(label)}</span>
    <span class="track"><i class="${cls || ""}" style="width:${Math.min(100, w)}%"></i></span>
    <span class="val">${pct(wr)}</span>
    <span class="n">${games != null ? games.toLocaleString() : ""}</span>
  </div>`;
}

function wrClass(wr, avg){
  if(wr == null || avg == null) return "";
  if(wr >= avg + 0.015) return "hot";
  if(wr <= avg - 0.015) return "cold";
  return "";
}

/* 勝率データが無いセットでも、下見（カード枚数の分析）があればそれを本文に出す。
   固定ページ sets/<SET>.profile(.en).html の本文（<article class="mode">）を読み込んで差し込む。
   勝率データが出て記事ができれば、ふつうの表示に自動で切り替わる */
const profileCache = {};
async function showProfile(code){
  try{
    const href = `./sets/${code}.profile${I18N.lang === "en" ? ".en" : ""}.html`;
    let html = profileCache[href];
    if(html == null){
      const r = await fetch(href, {cache:"no-cache"});
      if(!r.ok) return false;
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const art = doc.querySelector("article.mode");
      if(!art) return false;
      html = art.innerHTML;
      profileCache[href] = html;
    }
    const box = $("body");
    box.innerHTML = `<div class="profile">${html}</div>`;
    // 固定ページ冒頭の「勝率データは〇月〇日ごろから」は、上の案内文に合わせて1つにまとめる
    let when = "";
    const first = box.querySelector(".profile > .verdict");
    if(first){ when = first.textContent.trim(); first.remove(); }
    box.hidden = false;
    // 色のタブ
    box.querySelectorAll(".ctab").forEach(b => {
      b.onclick = () => {
        box.querySelectorAll(".ctab").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", String(x === b)); });
        box.querySelectorAll(".grp").forEach(g => { g.hidden = g.dataset.grp !== b.dataset.grp; });
      };
    });
    // カード名にカーソルを合わせたら画像を出す（固定ページが data-img に入れている）
    box.querySelectorAll("tr[data-img]").forEach(tr => {
      const url = tr.dataset.img;
      if(TOUCH){ tr.onclick = () => tapPreview([url], ""); return; }
      tr.onmouseenter = ev => { const pv = $("preview"); pv.innerHTML = ""; const img = document.createElement("img"); img.src = url; img.alt = ""; pv.appendChild(img); pv.style.display = "block"; movePreview(ev.clientX, ev.clientY); };
      tr.onmousemove  = ev => movePreview(ev.clientX, ev.clientY);
      tr.onmouseleave = hidePreview;
    });
    $("built").textContent = "";
    if($("video")) $("video").hidden = true;
    setStatus((when ? when + " " : "") + t("reports.profileNow"), false);
    $("status").classList.add("preview");
    return true;
  }catch(e){ return false; }
}
/* 環境まとめ動画（YouTube ショート）。data/videos.json に public のものがあれば、集計の下に出す。押すまで YouTube は読み込まない */
let videos = null;
async function loadVideos(){
  if(videos) return videos;
  try{ const r = await fetch("./data/videos.json", {cache:"no-cache"}); videos = r.ok ? await r.json() : {}; }catch(e){ videos = {}; }
  return videos;
}
async function renderVideo(code, mode){
  const box = $("video"); if(!box) return;
  const all = await loadVideos();
  let v = all && all[code] && all[code][I18N.lang];
  if(v && v.id) v = { draft: v };          // 昔の形（言語の直下に id）はドラフト
  v = v && v[mode || "draft"];
  if(!v || !v.id || v.public === false){ box.hidden = true; box.innerHTML = ""; return; }
  const id = String(v.id);
  // 自前のサムネイル（assets/video/<SET>-<言語>[-sealed].jpg）があればそれを。無ければ YouTube の自動サムネイル
  const yt = `https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg`;
  const poster = `./assets/video/${esc(code)}-${esc(I18N.lang)}${(mode || "draft") === "draft" ? "" : "-" + esc(mode)}.jpg`;
  box.innerHTML = `<div class="yt"><img src="${poster}" onerror="this.onerror=null;this.src='${yt}'" alt="${esc(v.title || t("reports.video.h"))}" loading="lazy" width="240" height="427">
    <button type="button" aria-label="${esc(t("reports.video.play"))}"><span></span></button></div>
    <div class="vtext"><h3>${esc(t("reports.video.h"))}</h3><p>${esc(t("reports.video.lead"))}</p>
    <p><a href="https://www.youtube.com/shorts/${esc(id)}" target="_blank" rel="noopener">${esc(t("reports.video.open"))}</a></p></div>`;
  box.querySelector("button").addEventListener("click", function(){
    const b = this.parentNode, f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1`;
    f.allow = "autoplay; encrypted-media; picture-in-picture"; f.allowFullscreen = true; f.title = this.getAttribute("aria-label");
    b.innerHTML = ""; b.appendChild(f);
  });
  box.hidden = false;
}

function render(){
  const d = report, avg = d.overall_win_rate;
  renderVideo(d.set, d.mode);
  const ev = t("mode." + d.mode);

  setStatus(t("reports.summary", {
    set: d.set, ev,
    g: (d.total_games || 0).toLocaleString(),
    wr: (avg * 100).toFixed(1)
  }));
  const srcList = (d.events || []).map(e => t("ev." + e.event) + " " + e.games.toLocaleString()).join("、");
  $("built").textContent = t("reports.built", { d: new Date(d.data_generated_at).toLocaleDateString("ja-JP") })
    + (srcList ? "　" + t("reports.sources", { list: srcList }) : "");

  const out = [];

  // 環境の速さ（最も勝率の高い区分だけを書く）
  if(d.speed && d.speed.length){
    const best = d.speed.filter(s => s.wr != null).sort((a, b) => b.wr - a.wr)[0];
    if(best){
      out.push(`<section>
        <h2>${t("reports.speed.h")}</h2>
        <div class="verdict">${d.verdict && d.verdict.key ? `<b>${esc(t("verdict." + d.verdict.key))}</b><span class="gap">` : ""}${t("reports.speed.best", {
            label: t("reports.speedn." + best.key), p: (best.wr * 100).toFixed(1)
          })}${paceLine()}${d.verdict && d.verdict.key ? `</span>` : ""}</div>
        ${d.notes?.speed ? `<div class="notes" style="margin-top:14px"><p>${esc(d.notes.speed[I18N.lang] || "")}</p></div>` : ""}
      </section>`);
    }
  }

  // 色の強さ
  if(d.colors && d.colors.length){
    out.push(`<section>
      <h2>${t("reports.colors.h")}</h2>
      <p class="lead">${t("reports.colors.lead")}</p>
      <div class="bars">${d.colors.map(c => {
        const def = COLORS.find(x => x.key === c.color);
        return barRow(t("color." + c.color), c.wr, c.games, wrClass(c.wr, avg), def && def.var);
      }).join("")}</div>
    </section>`);
  }

  // 色の組み合わせ
  if(d.archetypes && d.archetypes.length){
    out.push(`<section>
      <h2>${t("reports.arche.h")}</h2>
      <p class="lead">${t("reports.arche.lead")}</p>
      <div class="bars">${d.archetypes.map(a =>
        barRow([...a.colors].map(k => t("color." + k)).join(I18N.isJa() ? "／" : " / "), a.wr, a.games, wrClass(a.wr, avg))).join("")}</div>
      ${d.notes?.archetypes ? `<div class="notes" style="margin-top:14px"><p>${esc(d.notes.archetypes[I18N.lang] || "")}</p></div>` : ""}
    </section>`);
  }

  // マナ総量
  if(d.curve && d.curve.length){
    out.push(`<section>
      <h2>${t("reports.curve.h")}</h2>
      <p class="lead">${t("reports.curve.lead")}</p>
      <div class="bars">${d.curve.map(c =>
        barRow(c.cmc + (I18N.isJa() ? "マナ" : " MV"), c.wr, c.games, wrClass(c.wr, avg))).join("")}</div>
    </section>`);
  }

  // レアリティ別のカード
  const hasCards = RARITIES.some(r => (d.top?.[r] || []).length);
  if(hasCards){
    const groups = RARITIES.map(r => {
      const list = cardsOf(r);
      if(!list.length) return "";
      return `<div class="rar-group">
        <h3>${t("rarity." + r)}</h3>
        <table><thead><tr>
          <th>${t("reports.col.card")}</th><th>${t("reports.col.cmc")}</th>
          <th>${t("reports.col.wr")}</th><th>IWD</th><th>${t("reports.col.games")}</th>
        </tr></thead><tbody>
        ${list.map(c => {
          const col = (c.color || "").length === 1 ? c.color : ((c.color || "").length > 1 ? "M" : "C");
          const def = COLORS.find(x => x.key === col);
          return `<tr data-card="${esc(c.name)}">
            <td><span class="cname"><span class="dot" style="background:var(${def ? def.var : "--c"})"></span>
              <span class="nm">${esc(displayName(c.name))}</span></span></td>
            <td>${c.cmc ?? "—"}</td>
            <td class="wr ${wrClass(c.gih, avg)}">${pct(c.gih)}</td>
            <td>${c.iwd == null ? "—" : (c.iwd >= 0 ? "+" : "") + (c.iwd * 100).toFixed(1)}</td>
            <td class="thin">${(c.games || 0).toLocaleString()}</td>
          </tr>`;
        }).join("")}
        </tbody></table>
      </div>`;
    }).join("");

    const chip = (n, key) =>
      `<button type="button" class="chip" data-n="${n}" aria-pressed="${topN === n}">${t(key)}</button>`;
    out.push(`<section>
      <h2>${t("reports.cards.h")}</h2>
      <p class="lead">${t("reports.cards.lead", {n: MIN_GAMES.toLocaleString()})}</p>
      <div class="chips"><span class="lbl">${t("reports.show")}</span>
        ${chip(10, "reports.show10")}${chip(30, "reports.show30")}${chip(0, "reports.showAll")}</div>
      ${groups}
      ${d.notes?.cards ? `<div class="notes"><p>${esc(d.notes.cards[I18N.lang] || "")}</p></div>` : ""}
    </section>`);
  }

  // 全体の考察
  if(d.notes?.summary){
    out.push(`<section>
      <h2>${t("reports.notes.h")}</h2>
      <div class="notes"><p>${esc(d.notes.summary[I18N.lang] || "")}</p></div>
    </section>`);
  }

  $("body").innerHTML = out.join("");
  $("body").hidden = false;

  // 表示件数の切り替え
  $("body").querySelectorAll(".chips [data-n]").forEach(b => {
    b.onclick = async () => {
      const n = parseInt(b.dataset.n, 10);
      if(n === topN) return;
      if(n !== 10){
        b.textContent = "…";
        try{ await loadFull(); }
        catch(e){ setStatus(t("reports.none"), true); render(); return; }
      }
      topN = n;
      try{ localStorage.setItem("sw.reports.topn", String(n)); }catch(e){}
      render();
    };
  });

  // カード名にカーソルを合わせたら画像を出す
  $("body").querySelectorAll("tr[data-card]").forEach(tr => {
    const name = tr.dataset.card;
    if(TOUCH){ tr.onclick = () => { const u = imageUrls(name); if(u.length) tapPreview(u, displayName(name)); }; return; }
    tr.onmouseenter = ev => showPreview(name, ev.clientX, ev.clientY);
    tr.onmousemove  = ev => movePreview(ev.clientX, ev.clientY);
    tr.onmouseleave = hidePreview;
  });
}

/* ---------- 画像プレビュー ---------- */
/* スマホ（カーソルが無い端末）：行をタップで画像を画面中央に出し、もう一度どこかをタップで閉じる */
const TOUCH = window.matchMedia && window.matchMedia("(hover: none)").matches;
function tapPreview(urls, alt){
  const box = $("preview"), dim = $("tapdim");
  if(box.classList.contains("tap")){ closeTap(); return; }
  box.innerHTML = "";
  urls.forEach(u => { const img = document.createElement("img"); img.src = u; img.alt = alt || ""; box.appendChild(img); });
  box.classList.add("tap"); box.style.display = "block"; box.style.left = ""; box.style.top = "";
  dim.classList.add("on");
}
function closeTap(){
  const box = $("preview"), dim = $("tapdim");
  box.classList.remove("tap"); box.style.display = "none"; box.innerHTML = "";
  dim.classList.remove("on");
}
document.addEventListener("click", ev => { if($("preview").classList.contains("tap") && !ev.target.closest("tr[data-card], tr[data-img]")) closeTap(); });
$("tapdim").addEventListener("click", closeTap);

function showPreview(name, x, y){
  const urls = imageUrls(name);
  if(!urls.length) return;
  const box = $("preview");
  box.innerHTML = "";
  urls.forEach(u => {
    const img = document.createElement("img");
    img.src = u; img.alt = displayName(name); img.loading = "lazy";
    box.appendChild(img);
  });
  box.style.display = "block";
  movePreview(x, y);
}

function movePreview(x, y){
  const box = $("preview");
  if(box.style.display !== "block") return;
  const w = 252, h = box.offsetHeight || 350;
  let left = x + 18, top = y - h / 2;
  if(left + w > window.innerWidth - 8) left = x - w - 18;
  if(left < 8) left = 8;
  top = Math.min(Math.max(8, top), window.innerHeight - h - 8);
  box.style.left = left + "px";
  box.style.top = top + "px";
}

function hidePreview(){
  const box = $("preview");
  box.style.display = "none";
  box.innerHTML = "";
}

/* ---------- イベント ---------- */
$("setSelect").onchange = () => { updateModeTabs(); load(); };
function syncStaticLink(){
  const code = $("setSelect").value;
  const suffix = I18N.lang === "en" ? ".en" : "";
  $("staticLink").href = !code ? `./sets/index${suffix}.html` : (profileOnly.includes(code) ? `./sets/${code}.profile${suffix}.html` : `./sets/${code}${suffix}.html`);
}
$("setSelect").addEventListener("change", syncStaticLink);
document.querySelectorAll("#modeTabs .tab").forEach(b => {
  b.onclick = () => {
    if(b.disabled || b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    syncModeTabs();
    load();
  };
});
$("langSelect").value = I18N.lang;
$("langSelect").onchange = e => I18N.set(e.target.value);
I18N.onChange(() => {
  hidePreview(); renderSetOptions(); updateModeTabs(); syncStaticLink();
  load();   // 記事も下見も、表示中の言語で読み直す
});
window.addEventListener("scroll", hidePreview, {passive:true});

loadIndex();
