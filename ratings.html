<!DOCTYPE html>
<html lang="ja" data-title="page.ratings.title" data-desc="desc.ratings">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card win rates — MTG Arena Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --pine:#23342E; --pine-deep:#18241F;
    --paper:#F3F5F1; --paper-2:#E6EAE3;
    --ink:#0F1C17; --muted:#63736C;
    --gold:#B8912F; --line:#CBD3CA;
    --w:#E7CF86; --u:#7FB4D8; --b:#7A7480; --r:#DB8068; --g:#79A87F; --m:#C3A03B; --c:#9AA3A0;
    --hot:#2F6B47; --cold:#A24B32;
    --radius:3px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.7}
  h1,h2,h3{font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.15}

  header{background:var(--pine);color:var(--paper);padding:24px 24px 20px;border-bottom:4px solid var(--gold)}
  .wrap{max-width:1180px;margin:0 auto}
  .head-top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
  header h1{font-size:24px;margin:0}
  header p{margin:6px 0 0;color:#B9C7C0;font-size:13px;max-width:60ch}
  nav{margin-top:14px;display:flex;gap:16px;font-size:13px}
  nav a{color:#B9C7C0;text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent}
  nav a:hover{color:var(--paper)}
  nav a.on{color:var(--paper);border-bottom-color:var(--gold)}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,button{font-family:inherit;font-size:14px}
  select{background:var(--pine-deep);color:var(--paper);border:1px solid #3D544B;padding:9px 12px;border-radius:var(--radius);min-width:200px}
  button{border:none;border-radius:var(--radius);padding:10px 18px;cursor:pointer;background:var(--gold);color:#1A1405;font-weight:700}
  button:hover:not(:disabled){background:#CBA33B}
  button:disabled{background:#6E7772;color:#C6CCC9;cursor:not-allowed}
  label.toggle{display:flex;align-items:center;gap:7px;color:var(--paper);font-size:13px;cursor:pointer;user-select:none}
  label.toggle input{width:15px;height:15px;accent-color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  main{max-width:1180px;margin:0 auto;padding:20px 24px 70px}
  .status{padding:14px 16px;background:var(--paper-2);border-left:3px solid var(--muted);font-size:14px;color:var(--muted);margin-bottom:16px}
  .status.err{border-left-color:#B4432E;color:#8A3422;background:#F6E9E5}

  .filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .chips>span.lbl{font-size:12px;color:var(--muted);margin-right:3px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--pine);color:var(--paper);border-color:var(--pine)}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  thead th{
    position:sticky;top:0;background:var(--paper);z-index:2;
    text-align:right;font-size:12px;font-weight:700;color:var(--muted);
    padding:9px 8px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;
  }
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th[aria-sort]{color:var(--ink)}
  thead th .arw{font-size:10px;margin-left:3px}
  tbody td{padding:6px 8px;border-bottom:1px solid var(--paper-2);text-align:right;font-size:14px}
  tbody td:first-child{text-align:left}
  tbody td:nth-child(2){text-align:left;font-size:12px;color:var(--muted);white-space:nowrap}
  tbody tr:hover{background:var(--paper-2)}
  .cname{display:flex;align-items:center;gap:7px}
  .cname .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .rar{font-size:11px;border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--muted)}
  .num.hot{color:var(--hot);font-weight:700}
  .num.cold{color:var(--cold)}
  .thin{color:var(--muted);font-size:12px}

  .cname .nm{border-bottom:1px dotted var(--line);cursor:default}
  #preview{position:fixed;z-index:50;pointer-events:none;display:none;filter:drop-shadow(0 10px 24px rgba(15,28,23,.35))}
  #preview img{display:block;width:244px;height:auto;border-radius:11px}
  #preview img + img{margin-top:6px}

  footer{max-width:1180px;margin:0 auto;padding:0 24px 50px;color:var(--muted);font-size:11.5px;line-height:1.9}
  footer a{color:var(--muted)}
  .note{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .note b{color:var(--ink)}
</style>

<header>
  <div class="wrap">
    <div class="head-top">
      <div>
        <h1 data-i18n="ratings.h1"></h1>
        <p data-i18n="ratings.lead"></p>
      </div>
      <div class="controls">
        <select id="setSelect" data-i18n-label="sel.set"><option>…</option></select>
        <select id="eventSelect" data-i18n-label="sel.event">
          <option value="PremierDraft" data-i18n="ev.PremierDraft"></option>
          <option value="TradDraft" data-i18n="ev.TradDraft"></option>
          <option value="QuickDraft" data-i18n="ev.QuickDraft"></option>
          <option value="Sealed" data-i18n="ev.Sealed"></option>
          <option value="TradSealed" data-i18n="ev.TradSealed"></option>
        </select>
        <button id="loadBtn" disabled data-i18n="ratings.load"></button>
        <select id="langSelect" data-i18n-label="lang.label" style="min-width:120px"><option value="ja">日本語</option><option value="en">English</option></select>
      </div>
    </div>
    <nav>
      <a href="./" data-i18n="nav.sealed"></a>
      <a href="./draft.html" data-i18n="nav.draft"></a>
      <a href="./ratings.html" class="on" data-i18n="nav.ratings"></a>
    </nav>

</header>

<main>
  <div id="status" class="status" data-i18n="ratings.ready"></div>

  <div class="note" data-i18n-html="ratings.note"></div>

  <div class="filters" id="filters" hidden>
    <div class="chips" id="colorChips"><span class="lbl" data-i18n="ratings.f.color"></span></div>
    <div class="chips" id="rarityChips"><span class="lbl" data-i18n="ratings.f.rarity"></span></div>
    <div class="chips"><span class="lbl" data-i18n="ratings.f.games"></span>
      <button class="chip" data-min="0" aria-pressed="true" data-i18n="ratings.f.all"></button>
      <button class="chip" data-min="500" aria-pressed="false" data-i18n="ratings.f.500"></button>
      <button class="chip" data-min="2000" aria-pressed="false" data-i18n="ratings.f.2000"></button>
    </div>
  </div>

  <table id="tbl" hidden>
    <thead>
      <tr>
        <th data-key="name" data-i18n="ratings.col.name"></th>
        <th data-key="rarity" data-i18n="ratings.col.rar"></th>
        <th data-key="gih" aria-sort="descending"><span data-i18n="ratings.col.gih"></span></th>
        <th data-key="gp" data-i18n="ratings.col.gp"></th>
        <th data-key="iwd" data-i18n="ratings.col.iwd"></th>
        <th data-key="gns" data-i18n="ratings.col.gns"></th>
        <th data-key="gp_games" data-i18n="ratings.col.play"></th>
        <th data-key="games" data-i18n="ratings.col.games"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</main>

<div id="preview" aria-hidden="true"></div>

<footer>
  <span data-i18n-html="foot.scryfall"></span><br>
  <span data-i18n-html="foot.17lands"></span><br>
  <span data-i18n-html="foot.wotc"></span>
</footer>

<script>
const SCRY = "https://api.scryfall.com";
const COLOR_DEFS = [
  {key:"W", var:"--w"}, {key:"U", var:"--u"}, {key:"B", var:"--b"},
  {key:"R", var:"--r"}, {key:"G", var:"--g"}, {key:"M", var:"--m"}, {key:"C", var:"--c"}
];
const colorLabel = k => t(k === "C" ? "color.Cshort" : "color." + k);
const RARITIES = [
  {key:"common",   label:"C"},
  {key:"uncommon", label:"U"},
  {key:"rare",     label:"R"},
  {key:"mythic",   label:"M"}
];
let sets = [], cards = [], jaMap = {}, nameMap = {}, source = "", available = null;
let sortKey = "gih", sortDesc = true;
let colorFilter = new Set(), rarityFilter = new Set(), minGames = 0;

const RAR_FROM_CSV = { C:"common", U:"uncommon", R:"rare", M:"mythic" };

/* ---------- CSV ---------- */
function parseCsvLine(line){
  const out = [];
  let cur = "", inQ = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQ){
      if(ch === '"'){
        if(line[i + 1] === '"'){ cur += '"'; i++; }
        else inQ = false;
      }else cur += ch;
    }else{
      if(ch === '"') inQ = true;
      else if(ch === ","){ out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

const numOrNull = s => {
  if(s == null) return null;
  const t = String(s).trim().replace(/[%]/g, "").replace(/pp$/, "");
  if(t === "") return null;
  const v = Number(t);
  return isNaN(v) ? null : v;
};

function parseCsv(text){
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(l => l.trim());
  if(lines.length < 2) return [];
  const head = parseCsvLine(lines[0]).map(h => h.trim());
  const idx = {};
  head.forEach((h, i) => { idx[h] = i; });
  const get = (row, key) => (idx[key] != null ? row[idx[key]] : "");

  return lines.slice(1).map(l => {
    const r = parseCsvLine(l);
    const pctv = k => { const v = numOrNull(get(r, k)); return v == null ? null : v / 100; };
    return {
      name:   (get(r, "Name") || "").trim(),
      id:     null,
      color:  (get(r, "Color") || "").trim(),
      rarity: RAR_FROM_CSV[(get(r, "Rarity") || "").trim()] || "",
      gih:    pctv("GIH WR"),
      gp:     pctv("GP WR"),
      iwd:    pctv("IIH"),
      alsa:   numOrNull(get(r, "ALSA")),
      ata:    numOrNull(get(r, "ATA")),
      games:  numOrNull(get(r, "# GIH")) || 0,
      picks:  numOrNull(get(r, "# Picked")) || 0,
      url:    "", url_back: ""
    };
  }).filter(c => c.name);
}

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setStatus(msg, isErr){
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}

/* ---------- セット一覧 ---------- */
async function loadSets(){
  try{
    // どの組み合わせの集計があるかを先に知る
    try{
      const r = await fetch("./data/ratings/index.json", {cache:"no-cache"});
      if(r.ok) available = (await r.json()).datasets || [];
    }catch(e){ available = null; }

    const res = await fetch(SCRY + "/sets");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    const today = new Date().toISOString().slice(0,10);
    sets = d.data
      .filter(s => ["expansion","core"].includes(s.set_type) && s.released_at && s.released_at <= today && s.card_count > 100);

    if(available && available.length){
      const have = new Set(available.map(a => a.set.toUpperCase()));
      sets = sets.filter(s => have.has(s.code.toUpperCase()));
    }
    sets = sets.slice(0, 30);

    renderSetOptions();
    updateEventOptions();
    $("loadBtn").disabled = false;
    setStatus(t("ratings.ready"));
  }catch(e){
    setStatus(t("err.sets", {e: e.message}), true);
  }
}

/* 選んだセットで用意のあるイベント種別だけを有効にする */
function updateEventOptions(){
  if(!available) return;
  const code = ($("setSelect").value || "").toUpperCase();
  const have = new Set(available.filter(a => a.set.toUpperCase() === code).map(a => a.event));
  let first = null;
  [...$("eventSelect").options].forEach(o => {
    o.disabled = have.size > 0 && !have.has(o.value);
    if(!o.disabled && first === null) first = o.value;
  });
  if(first && $("eventSelect").selectedOptions[0]?.disabled) $("eventSelect").value = first;
}

function renderSetOptions(){
  const sel = $("setSelect"), keep = sel.value;
  sel.innerHTML = "";
  sets.forEach(s => {
    const o = document.createElement("option");
    o.value = s.code;
    o.textContent = I18N.setName(s.code, s.name) + "（" + s.code.toUpperCase() + "）";
    sel.appendChild(o);
  });
  if(keep) sel.value = keep;
}

/* ---------- 日本語名・日本語版画像 ----------
   17Lands はアリーナ内部ID（mtga_id）を返すので、
   Scryfall の arena_id と収録番号を橋渡しして日本語版に結び付ける。 */
async function loadCardMaps(code){
  jaMap = {}; nameMap = {};
  try{
    // 1) 英語版から arena_id・カード名 → 収録番号・画像 の対応を作る
    const arenaToCn = {}, nameToCn = {}, enImgs = {}, enMeta = {};
    let url = SCRY + "/cards/search?q=" + encodeURIComponent("set:" + code) + "&unique=prints";
    while(url){
      const res = await fetch(url);
      if(!res.ok) break;
      const d = await res.json();
      d.data.forEach(c => {
        if(c.arena_id && !arenaToCn[c.arena_id]) arenaToCn[c.arena_id] = c.collector_number;
        if(!nameToCn[c.name]) nameToCn[c.name] = c.collector_number;
        if(!enMeta[c.name]){
          const ci = (c.color_identity || []).join("");
          enMeta[c.name] = {
            color: (c.type_line || "").includes("Land") && !ci ? "" : ci,
            rarity: c.rarity || ""
          };
        }
        if(!enImgs[c.name]){
          enImgs[c.name] = c.image_uris?.normal
            ? [c.image_uris.normal]
            : (Array.isArray(c.card_faces) ? c.card_faces.map(f => f.image_uris?.normal).filter(Boolean) : []);
        }
      });
      url = d.has_more ? d.next_page : null;
      if(url) await sleep(120);
    }

    // 2) 日本語版から 収録番号 → 名前・画像 の対応を作る
    const cnToJa = {};
    url = SCRY + "/cards/search?q=" + encodeURIComponent("set:" + code + " lang:ja")
        + "&unique=prints&include_multilingual=true";
    while(url){
      const res = await fetch(url);
      if(!res.ok) break;
      const d = await res.json();
      d.data.forEach(c => {
        if(c.lang !== "ja" || cnToJa[c.collector_number]) return;
        const name = c.printed_name
          || (Array.isArray(c.card_faces) ? c.card_faces.map(f => f.printed_name).filter(Boolean).join(" // ") : "");
        const imgs = c.image_uris?.normal
          ? [c.image_uris.normal]
          : (Array.isArray(c.card_faces) ? c.card_faces.map(f => f.image_uris?.normal).filter(Boolean) : []);
        cnToJa[c.collector_number] = { name, imgs };
      });
      url = d.has_more ? d.next_page : null;
      if(url) await sleep(120);
    }

    // 3) アリーナID／カード名のどちらでも引けるようにする
    Object.entries(arenaToCn).forEach(([aid, cn]) => {
      if(cnToJa[cn]) jaMap[aid] = cnToJa[cn];
    });
    Object.entries(nameToCn).forEach(([nm, cn]) => {
      nameMap[nm] = { ...(cnToJa[cn] || {}), enImgs: enImgs[nm] || [], ...(enMeta[nm] || {}) };
    });
  }catch(e){ jaMap = {}; nameMap = {}; }
}

/* ---------- 勝率データ ---------- */
async function load(){
  const code = $("setSelect").value;
  const event = $("eventSelect").value;
  const eventLabel = $("eventSelect").selectedOptions[0].textContent;
  $("loadBtn").disabled = true;
  $("tbl").hidden = true;
  $("filters").hidden = true;
  setStatus(t("ratings.loading"));
  let apiNote = "";

  try{
    let info = null;
    source = "";

    // 集計済みの公開データセット（CC BY 4.0）を読み込む
    const res = await fetch(`./data/ratings/${code.toUpperCase()}_${event}.json`, {cache:"no-cache"});
    if(!res.ok){
      setStatus(t("ratings.none"), true);
      return;
    }
    const d = await res.json();
    cards = d.cards.map(c => ({ ...c, id: null, color: "", rarity: "", url: "", url_back: "" }));
    source = "dataset";
    info = { count: d.count, total: d.total_games, generated: d.generated_at, wr: d.overall_win_rate };

    setStatus(t("ratings.loadingJa"));
    await loadCardMaps(code);

    // 公開データセットには色とレアリティが無いので Scryfall から補う
    cards.forEach(c => {
      const n = nameMap[c.name];
      if(n){ c.color = n.color || ""; c.rarity = n.rarity || ""; }
    });

    buildFilters();
    render();

    const g = (info.total || 0).toLocaleString();
    const when = new Date(info.generated).toLocaleDateString("ja-JP");
    const wr = info.wr != null ? t("ratings.overall", {p: (info.wr * 100).toFixed(1)}) : "";
    setStatus(t("ratings.summary", {set: code.toUpperCase(), ev: eventLabel, n: info.count, g, wr, d: when}),
              (info.total || 0) < 5000);
  }catch(e){
    setStatus(t("ratings.fail"), true);
  }finally{
    $("loadBtn").disabled = false;
  }
}

/* ---------- 絞り込み ---------- */
function buildFilters(){
  const cc = $("colorChips"), rc = $("rarityChips");
  cc.querySelectorAll(".chip").forEach(b => b.remove());
  rc.querySelectorAll(".chip").forEach(b => b.remove());
  colorFilter.clear(); rarityFilter.clear();

  COLOR_DEFS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<span class="dot" style="background:var(${c.var})"></span>${c.label}`;
    b.onclick = () => {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", String(!on));
      on ? colorFilter.delete(c.key) : colorFilter.add(c.key);
      render();
    };
    cc.appendChild(b);
  });

  RARITIES.forEach(r => {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", "false");
    b.textContent = r.label;
    b.onclick = () => {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", String(!on));
      on ? rarityFilter.delete(r.key) : rarityFilter.add(r.key);
      render();
    };
    rc.appendChild(b);
  });

  $("filters").hidden = false;
}

function colorKey(c){
  const s = (c.color || "").replace(/[^WUBRG]/g, "");
  if(!s) return "C";
  if(s.length > 1) return "M";
  return s;
}

/* ---------- 表示 ---------- */
const pct = v => (v == null || isNaN(v)) ? "—" : (v * 100).toFixed(1) + "%";
const sgn = v => (v == null || isNaN(v)) ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1);
const ord = v => (v == null || isNaN(v)) ? "—" : v.toFixed(2);

function render(){
  let list = cards.slice();
  if(colorFilter.size)  list = list.filter(c => colorFilter.has(colorKey(c)));
  if(rarityFilter.size) list = list.filter(c => rarityFilter.has(c.rarity));
  if(minGames)          list = list.filter(c => (c.games || 0) >= minGames);

  const dir = sortDesc ? -1 : 1;
  list.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if(sortKey === "name"){
      x = displayName(a); y = displayName(b);
      return x.localeCompare(y, "ja") * (sortDesc ? -1 : 1);
    }
    if(sortKey === "rarity"){
      const o = {common:0, uncommon:1, rare:2, mythic:3};
      x = o[a.rarity] ?? -1; y = o[b.rarity] ?? -1;
    }
    if(x == null) return 1;
    if(y == null) return -1;
    return (x - y) * dir;
  });

  // GIH勝率の色付け基準
  const vals = list.map(c => c.gih).filter(v => v != null);
  const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;

  const tb = $("tbody");
  tb.innerHTML = "";
  list.forEach(c => {
    const tr = document.createElement("tr");
    const ck = colorKey(c);
    const cv = (COLOR_DEFS.find(x => x.key === ck) || {}).var || "--c";
    const cls = c.gih == null ? "" : (c.gih >= avg + 0.02 ? " hot" : (c.gih <= avg - 0.02 ? " cold" : ""));
    const thin = (c.games || 0) < 200 ? " thin" : "";
    tr.innerHTML =
      `<td><span class="cname"><span class="dot" style="background:var(${cv})"></span>` +
      `<span class="nm">${esc(displayName(c))}</span></span></td>` +
      `<td><span class="rar">${(RARITIES.find(r => r.key === c.rarity) || {label:"?"}).label}</span></td>` +
      `<td class="num${cls}${thin}">${pct(c.gih)}</td>` +
      `<td class="num${thin}">${pct(c.gp)}</td>` +
      `<td class="num${thin}">${sgn(c.iwd)}</td>` +
      `<td class="num${thin}">${pct(c.gns)}</td>` +
      `<td class="num thin">${(c.gp_games || 0).toLocaleString()}</td>` +
      `<td class="num thin">${(c.games || 0).toLocaleString()}</td>`;

    const nm = tr.querySelector(".nm");
    nm.onmouseenter = ev => showPreview(c, ev.clientX, ev.clientY);
    nm.onmousemove  = ev => movePreview(ev.clientX, ev.clientY);
    nm.onmouseleave = hidePreview;
    tb.appendChild(tr);
  });

  $("tbl").hidden = false;
  updateHeaders();
}

function jaEntry(c){
  if(!I18N.isJa()) return null;
  return (c.id && jaMap[c.id]) || nameMap[c.name] || null;
}

function displayName(c){
  const j = jaEntry(c);
  return (j && j.name) ? j.name : c.name;
}

function imageUrls(c){
  const j = jaEntry(c);
  if(j && j.imgs && j.imgs.length) return j.imgs;
  const n = nameMap[c.name];
  if(n && n.enImgs && n.enImgs.length) return n.enImgs;
  return [c.url, c.url_back].filter(Boolean);
}

/* ---------- 画像プレビュー ---------- */
function showPreview(c, x, y){
  const urls = imageUrls(c);
  if(!urls.length) return;
  const box = $("preview");
  box.innerHTML = "";
  urls.forEach(u => {
    const img = document.createElement("img");
    img.src = u;
    img.alt = displayName(c);
    img.loading = "lazy";
    box.appendChild(img);
  });
  box.style.display = "block";
  movePreview(x, y);
}

function movePreview(x, y){
  const box = $("preview");
  if(box.style.display !== "block") return;
  const w = 252, h = box.offsetHeight || 350;
  let left = x + 18, top = y - h / 2;
  if(left + w > window.innerWidth - 8) left = x - w - 18;
  if(left < 8) left = 8;
  top = Math.min(Math.max(8, top), window.innerHeight - h - 8);
  box.style.left = left + "px";
  box.style.top = top + "px";
}

function hidePreview(){
  const box = $("preview");
  box.style.display = "none";
  box.innerHTML = "";
}

const esc = s => (s || "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function updateHeaders(){
  document.querySelectorAll("thead th").forEach(th => {
    const k = th.dataset.key;
    th.removeAttribute("aria-sort");
    const a = th.querySelector(".arw");
    if(a) a.remove();
    if(k === sortKey){
      th.setAttribute("aria-sort", sortDesc ? "descending" : "ascending");
      const s = document.createElement("span");
      s.className = "arw";
      s.textContent = sortDesc ? "▼" : "▲";
      th.appendChild(s);
    }
  });
}

/* ---------- イベント ---------- */
document.querySelectorAll("thead th").forEach(th => {
  th.onclick = () => {
    const k = th.dataset.key;
    if(k === sortKey) sortDesc = !sortDesc;
    else { sortKey = k; sortDesc = (k !== "name" && k !== "alsa" && k !== "ata"); }
    hidePreview();
    render();
  };
});

document.querySelectorAll('#filters .chip[data-min]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#filters .chip[data-min]').forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    minGames = Number(b.dataset.min);
    render();
  };
});

$("loadBtn").onclick = load;
$("setSelect").onchange = updateEventOptions;
$("langSelect").value = I18N.lang;
$("langSelect").onchange = e => I18N.set(e.target.value);
I18N.onChange(() => { hidePreview(); renderSetOptions(); if(cards.length) render(); });
window.addEventListener("scroll", hidePreview, {passive:true});

loadSets();
</script>
