<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>対戦卓 2画面テスト — MTGアリーナ リミテッド・ワークベンチ</title>
<!-- 動作確認用のページなので、検索には載せない -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="./i18n.js?v=4"></script>
<script src="./analytics.js"></script>
<script src="/navmenu.js" defer></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10304F">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})</script>
<style>
  :root{
    --pine:#10304F; --paper:#F5F8FC; --paper-2:#E8EEF6;
    --ink:#0D1B2A; --muted:#5C7185; --gold:#2F7DF6; --line:#D3DFEB;
    --radius:8px; --z:.75;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper-2);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:14px;
       display:flex;flex-direction:column;overflow:hidden}
  button,select,input,textarea{font:inherit;font-family:inherit}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--radius);padding:6px 12px}
  button:hover{border-color:var(--gold)}
  button.primary{background:var(--pine);color:var(--paper);border-color:var(--pine);font-weight:700}
  button.primary:hover{background:#1A4A79}
  input,select,textarea{border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;background:#fff;color:var(--ink)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  header{background:linear-gradient(135deg,var(--pine-deep) 0%,var(--pine) 55%,#17466F 100%);color:var(--paper);padding:10px 16px;border-bottom:3px solid var(--gold);flex:0 0 auto}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ttl{font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;font-weight:800;font-size:15px;color:var(--gold);margin-right:6px}
  header .lbl{font-size:12px;color:#A9C2DE}
  header a{color:#C6D9EE;font-size:12px}
  .sp{flex:1}

  .note{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;color:var(--muted);font-size:12.5px}
  .note code{background:var(--paper-2);padding:1px 4px;border-radius:3px}
  details.deck{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px}
  details.deck summary{cursor:pointer;font-size:13px}
  details.deck .decks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  details.deck .dk{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  details.deck .dk > b{font-size:12.5px;color:var(--ink)}
  details.deck textarea{width:100%;min-height:150px;font-size:12.5px;line-height:1.5}
  @media (max-width:900px){ details.deck .decks{grid-template-columns:1fr} }

  .pair{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;min-height:0}
  .pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .pane h2{margin:0;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);background:var(--paper);
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .pane h2 .sp{flex:1}
  .pane h2 button{padding:2px 8px;font-size:11.5px}
  /* 倍率を下げると、半分の幅でも卓を広く表示できる */
  .box{flex:1 1 auto;position:relative;overflow:hidden}
  .box iframe{position:absolute;left:0;top:0;border:0;
              width:calc(100% / var(--z));height:calc(100% / var(--z));
              transform:scale(var(--z));transform-origin:0 0}
  .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
  @media (max-width:900px){ .pair{grid-template-columns:1fr} }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4578393433821297" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <div class="bar">
    <span class="ttl" id="s_ttl">対戦卓 2画面テスト</span>
    <label class="lbl" id="s_room">合言葉</label>
    <input id="room" size="16" maxlength="32" autocomplete="off">
    <button id="randBtn" title="">🎲</button>
    <button class="primary" id="openBtn">開く</button>
    <button id="reloadBtn">読み込み直す</button>
    <span class="sp"></span>
    <label class="lbl" id="s_zoom">倍率</label>
    <select id="zoom">
      <option value="1">100%</option>
      <option value="0.85">85%</option>
      <option value="0.75" selected>75%</option>
      <option value="0.65">65%</option>
      <option value="0.55">55%</option>
    </select>
    <select id="langSelect"><option value="ja">日本語</option><option value="en">English</option></select>
    <a href="./table.html" id="s_back">対戦卓へ戻る</a>
  </div>
</header>

<div class="note" id="s_note"></div>

<details class="deck" id="deckFold">
  <summary id="s_deckSum">デッキ（席ごとに別のものを使えます）</summary>
  <div class="decks">
    <label class="dk"><b id="s_dkA">席A のデッキ</b>
      <textarea id="deckA" spellcheck="false"></textarea>
      <div class="bar" style="margin-top:6px"><button data-sample="A" id="s_sampA">サンプル（赤青）</button></div>
    </label>
    <label class="dk"><b id="s_dkB">席B のデッキ</b>
      <textarea id="deckB" spellcheck="false"></textarea>
      <div class="bar" style="margin-top:6px">
        <button data-sample="B" id="s_sampB">サンプル（緑白）</button>
        <button id="copyBtn">席Aと同じにする</button>
      </div>
    </label>
  </div>
  <p class="lbl" id="s_deckHint" style="color:var(--muted);margin:10px 0 0"></p>
</details>

<div class="pair">
  <div class="pane">
    <h2><span id="s_seatA">席A</span><span class="sp"></span><button data-win="a" id="s_winA">別ウィンドウ</button></h2>
    <div class="box"><div class="empty" id="e_a"></div><iframe id="fa" hidden title="席A"></iframe></div>
  </div>
  <div class="pane">
    <h2><span id="s_seatB">席B</span><span class="sp"></span><button data-win="b" id="s_winB">別ウィンドウ</button></h2>
    <div class="box"><div class="empty" id="e_b"></div><iframe id="fb" hidden title="席B"></iframe></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- このページだけの文言 ---------- */
const L = {
  ja: {
    ttl: "対戦卓 2画面テスト", room: "合言葉", open: "開く", reload: "読み込み直す",
    zoom: "倍率", back: "対戦卓へ戻る", rand: "合言葉を作り直す",
    note: "同じ合言葉の2つの席を左右に並べて開きます。相手を待たずに、一人で両側を操作して動きを確かめられます。ここで使う席は普段の席とは別扱いなので、実際の対戦には影響しません。",
    deckSum: "デッキ（席ごとに別のものを使えます）",
    deckHint: "空のままでも開けます。その場合は各席でデッキを貼り付けてください。入れた内容はこのブラウザに残るので、次に開いたときもそのまま使えます。",
    dkA: "席A のデッキ", dkB: "席B のデッキ",
    sampA: "サンプル（赤青）", sampB: "サンプル（緑白）", copyAB: "席Aと同じにする",
    seatA: "席A（プレイヤー1）", seatB: "席B（プレイヤー2）", win: "別ウィンドウ",
    empty: "「開く」を押すと、ここに卓が出ます",
    bad: "合言葉は英数字とハイフン、3〜32文字で入れてください"
  },
  en: {
    ttl: "Play table — two-seat test", room: "Passphrase", open: "Open", reload: "Reload",
    zoom: "Zoom", back: "Back to the table", rand: "Make a new passphrase",
    note: "Opens two seats at the same table side by side, so you can work both sides yourself without waiting for an opponent. These seats are kept separate from your normal one, so real games are unaffected.",
    deckSum: "Decks (each seat can use its own)",
    deckHint: "You can leave these empty and paste a list in each seat instead. What you type here stays in this browser for next time.",
    dkA: "Seat A deck", dkB: "Seat B deck",
    sampA: "Sample (red-blue)", sampB: "Sample (green-white)", copyAB: "Same as seat A",
    seatA: "Seat A (Player 1)", seatB: "Seat B (Player 2)", win: "New window",
    empty: "Press Open and the table appears here",
    bad: "Use 3–32 letters, numbers or hyphens"
  }
};
const lang = () => (window.I18N && I18N.lang === "en") ? "en" : "ja";
const tt = k => L[lang()][k];

// どちらもリミテッドと同じ40枚（土地17／呪文23）。色を分けてあるので、左右どちらの盤面か見分けやすい
const SAMPLE = {
  A: `Deck
9 Mountain
8 Island
4 Lightning Bolt
4 Shock
4 Opt
4 Goblin Piker
4 Wind Drake
2 Air Elemental
1 Mahamoti Djinn`,
  B: `Deck
9 Forest
8 Plains
4 Llanowar Elves
4 Grizzly Bears
4 Pacifism
4 Giant Growth
3 Serra Angel
2 Craw Wurm
2 Healing Salve`
};

function newRoom() { return "test-" + Math.random().toString(36).slice(2, 7); }

function seatUrl(as, name, embed) {
  const room = $("room").value.trim().toLowerCase();
  return "./table.html?room=" + encodeURIComponent(room) +
         "&as=" + as +
         "&name=" + encodeURIComponent(name) +
         (embed ? "&embed=1" : "") +
         "&go=1&t=" + Date.now();
}

function openBoth() {
  const room = $("room").value.trim().toLowerCase();
  if (!/^[a-z0-9-]{3,32}$/.test(room)) { alert(tt("bad")); return; }
  saveDecks();
  for (const [id, as, nm] of [["fa", "a", "プレイヤー1"], ["fb", "b", "プレイヤー2"]]) {
    const f = $(id);
    f.hidden = false;
    f.src = seatUrl(as, lang() === "en" ? (as === "a" ? "Player 1" : "Player 2") : nm, true);
  }
  $("e_a").hidden = true; $("e_b").hidden = true;
}

/* 席ごとの置き場所に書いておくと、開いた卓がそれぞれ自分のぶんを読み込む */
function saveDecks() {
  try {
    localStorage.setItem("sw.table.deck.a", $("deckA").value);
    localStorage.setItem("sw.table.deck.b", $("deckB").value);
  } catch (e) {}
}

$("openBtn").addEventListener("click", openBoth);
$("reloadBtn").addEventListener("click", () => { if (!$("fa").hidden) openBoth(); });
$("randBtn").addEventListener("click", () => { try {
  $("deckA").value = localStorage.getItem("sw.table.deck.a") || "";
  $("deckB").value = localStorage.getItem("sw.table.deck.b") || "";
} catch (e) {}
// まだデッキを入れていなければ、最初から開いておく
$("deckFold").open = !($("deckA").value.trim() || $("deckB").value.trim());
$("room").value = newRoom(); });
document.querySelectorAll("[data-sample]").forEach(b => b.addEventListener("click", () => {
  $("deck" + b.dataset.sample).value = SAMPLE[b.dataset.sample];
}));
$("copyBtn").addEventListener("click", () => { $("deckB").value = $("deckA").value; });

document.querySelectorAll("[data-win]").forEach(b => b.addEventListener("click", () => {
  const room = $("room").value.trim().toLowerCase();
  if (!/^[a-z0-9-]{3,32}$/.test(room)) { alert(tt("bad")); return; }
  saveDecks();
  const as = b.dataset.win;
  const nm = lang() === "en" ? (as === "a" ? "Player 1" : "Player 2") : (as === "a" ? "プレイヤー1" : "プレイヤー2");
  window.open(seatUrl(as, nm), "_blank", "width=1280,height=900");
}));

$("zoom").addEventListener("change", e => {
  document.documentElement.style.setProperty("--z", e.target.value);
});

/* ---------- 文言の貼り替え ---------- */
function applyLocal() {
  const set = (id, k) => { const el = $(id); if (el) el.textContent = tt(k); };
  set("s_ttl", "ttl"); set("s_room", "room"); set("s_zoom", "zoom"); set("s_back", "back");
  set("s_note", "note"); set("s_deckSum", "deckSum"); set("s_deckHint", "deckHint");
  set("s_seatA", "seatA"); set("s_seatB", "seatB");
  set("s_dkA", "dkA"); set("s_dkB", "dkB");
  $("s_sampA").textContent = tt("sampA");
  $("s_sampB").textContent = tt("sampB");
  $("copyBtn").textContent = tt("copyAB");
  set("e_a", "empty"); set("e_b", "empty");
  $("openBtn").textContent = tt("open");
  $("reloadBtn").textContent = tt("reload");
  $("randBtn").title = tt("rand");
  $("s_winA").textContent = tt("win");
  $("s_winB").textContent = tt("win");
  document.documentElement.lang = lang();
}
if (window.I18N) {
  const sel = $("langSelect");
  sel.value = I18N.lang;
  sel.onchange = e => I18N.set(e.target.value);
  I18N.onChange(() => { sel.value = I18N.lang; applyLocal(); });
}
$("room").value = newRoom();
applyLocal();
</script>
</body>
</html>
