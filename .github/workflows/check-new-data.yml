name: データ｜1 新データの点検（自動・毎日）

# 毎日1回、17Lands に新しいセットの勝率データが出ていないか軽く調べる（数十秒）。
# 出ていれば「勝率データ集計」をそのまま起こす。集計のあとは、環境レポート・r/lrcast の下書き・
# 動画4本（日英 × ドラフト/シールド）まで自動で進む。動画の公開と「動画を配信」は手動。
# 先行版：発売直後のセットで 17Lands の試合数が揃ったら（2〜3日目ごろ）、先行版のショート（日英）を
# 「環境まとめ動画を作る」（速報）で起こす。数字の表はサイトに載せず、動画だけ（17Lands の決まり）。
# 17Lands のデータは紙の発売から12日後に出るので、新セットのたびに日付を覚えておく必要はない。

on:
  schedule:
    - cron: "30 18 * * *"      # 毎日 03:30（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 新しいデータがあるか調べる
        id: check
        run: |
          node maintenance/check-new-data.mjs > ready.txt
          echo "sets=$(grep -v '^EARLY ' ready.txt | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
          echo "early=$(grep '^EARLY ' ready.txt | sed 's/^EARLY //' | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

      - name: 勝率データ集計を起こす
        if: steps.check.outputs.sets != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SETS: ${{ steps.check.outputs.sets }}
        run: |
          gh workflow run build-ratings.yml --ref main
          echo "## 新しいデータを見つけました: $SETS" >> "$GITHUB_STEP_SUMMARY"
          echo "「勝率データ集計」を起こしました。終わると動画が4本、非公開で YouTube に上がります。" >> "$GITHUB_STEP_SUMMARY"

      - name: 先行版のショートを起こす
        if: steps.check.outputs.early != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EARLY: ${{ steps.check.outputs.early }}
        run: |
          for S in $EARLY; do
            gh workflow run build-short.yml --ref main -f set="$S" -f lang=both -f upload=true \
              && echo "先行版の動画づくりを開始: $S" || echo "::warning::先行版の動画づくりを始められませんでした: $S"
            gh workflow run early-web.yml --ref main -f set="$S" \
              && echo "速報メモの作成を開始: $S" || echo "::warning::速報メモの作成を始められませんでした: $S"
          done
          echo "## 先行版を作り始めました: $EARLY" >> "$GITHUB_STEP_SUMMARY"
          echo "「環境まとめ動画を作る」（速報）と「サイトに速報メモを載せる」を起こしました。終わると先行版のショートが日英2本、非公開で YouTube に上がり、下見ページが速報版になります。" >> "$GITHUB_STEP_SUMMARY"

      # 発売前後のセットに、勝率データが出るまでの「下見」ページを作る（2日ごとに作り直し、カードと日本語名が増えたら反映する）
      - name: セットの下見を作る
        run: |
          node maintenance/build-set-profile.mjs --auto || echo "::warning::下見を作れませんでした（Scryfall に届かない？）"
          if ! git diff --quiet -- sets data/profiles 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard sets data/profiles)" ]; then
            node maintenance/build-set-pages.mjs && node maintenance/build-seo.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for p in sets data/profiles data/names sitemap.xml; do [ -e "$p" ] && git add -A -- "$p"; done
            git commit -m "セットの下見を追加" && { for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep 5; done; }
            echo "## セットの下見を作りました" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 新しいデータが無いとき
        if: steps.check.outputs.sets == '' && steps.check.outputs.early == ''
        run: echo "新しいデータはありませんでした。" >> "$GITHUB_STEP_SUMMARY"
