name: SNS｜新セット発売の告知（自動・毎日）

# 新セットが MTGアリーナに出て、練習（ドラフト・シールド）ができるようになった日（紙の発売日の2日前〜1日後・日本時間）に、
# Bluesky に英語で1回だけ告知する（「友達とドラフト」へのリンクのカードつき）。毎日見に行くが、投稿するのはセットごとに1回だけ。
# 告知したセットは data/social/release-posted.json に記録し、2回は出さない。
# X（日本語・手で投稿）の文案は、この記録を見て「SNS｜X の文案を作る」が作る。
# 手で押すときは、セットを決めて「文面の確認だけ」にすると、投稿も記録もせずに文面だけ見られる。

on:
  schedule:
    - cron: "17 3 * * *"       # 毎日 12:17（日本時間）
  workflow_dispatch:
    inputs:
      set:
        description: "セット（例: FRA。空なら、今日が告知の日のセット）"
        default: ""
      dry_run:
        description: "文面の確認だけ（投稿も記録もしない）"
        type: boolean
        default: true

permissions:
  contents: write        # 告知の記録と X の文案をリポジトリに戻すため

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 告知する
        env:
          SITE_URL: https://sealed-workbench.com
          SET: ${{ inputs.set }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node maintenance/release-post.mjs

      - name: 告知の記録を戻す
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social || true
          if git diff --staged --quiet; then
            echo "告知はありませんでした。"
            exit 0
          fi
          git commit -m "新セットの告知を記録"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "押し戻せませんでした" && exit 1
