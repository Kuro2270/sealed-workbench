name: ショート｜修正版ショートを作る（手動）

# 修正版ショート（確定版のあと）を作る。役割はこれだけ（データは先に「データ｜修正版の集計（手動）」で作っておく）。
#   中身：ドラフトの「1週目 → 直近の1週間」で、勝率が上がったカード3枚・下がったカード3枚と、2色の組み合わせの変化
#   ・データは data/trends/<SET>_draft.json。無ければ作らずに終わる
#   ・ナレーションは日本語が VOICEVOX（ずんだもん）、英語が Kokoro。背景・BGM・サムネイルの作り方は「ショート｜1」と同じ
# できた動画はこの実行ページの「Artifacts」から ZIP で落とせる（30日で消える）。
# YouTube の許可が登録されていれば、非公開で自動的に上げる。公開にしたあと「ショート｜2 動画を配信」を押すと、サイトに載り SNS に案内が出る。

on:
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: FRA）"
        required: true
      lang:
        description: "作る言語（both = 日本語と英語の両方／ja／en）"
        type: choice
        options: [both, ja, en]
        default: both
      speed:
        description: "読み上げの速さ（1.0 = ふつう、1.2 = 少し速め）"
        required: false
        default: "1.2"
      upload:
        description: "できた動画を YouTube に非公開で上げる（許可の登録が済んでいるとき）"
        type: boolean
        default: true

permissions:
  contents: write        # 上げた動画の ID の記録とサムネイルのコミット、Releases への動画ファイルの保存のため
  issues: write          # 公開と配信のリマインドを Issue で出すため

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      set: ${{ steps.m.outputs.set }}
    steps:
      - id: m
        env:
          SET_IN: ${{ inputs.set }}
          LANG_IN: ${{ inputs.lang || 'both' }}
        run: |
          SET_CODE="$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          [ -n "$SET_CODE" ] || { echo "::error::セットコードを入れて実行してください。"; exit 1; }
          echo "set=$SET_CODE" >> "$GITHUB_OUTPUT"
          langs="$LANG_IN"; [ "$langs" = "both" ] && langs="ja en"
          items=""
          for l in $langs; do items="$items{\"lang\":\"$l\",\"mode\":\"trend\"},"; done
          echo "matrix=[${items%,}]" >> "$GITHUB_OUTPUT"
          echo "## $SET_CODE の修正版を作ります: [${items%,}]" >> "$GITHUB_STEP_SUMMARY"

  short:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false            # 1 本失敗しても残りは作る
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ needs.plan.outputs.set }} ${{ matrix.lang }} ${{ matrix.mode }}
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu22.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg と画像合成ライブラリを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          npm install --no-save sharp

      - name: 背景のプレイ映像を Releases から落とす
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p short
          if gh release download assets --repo "$GITHUB_REPOSITORY" --pattern bg.mp4 --dir short --clobber; then
            ls -la short/bg.mp4
          else
            echo "::warning::Releases（タグ assets）に bg.mp4 が無いので、紺色の背景で作ります。"
          fi

      - name: 英語の読み上げ（Kokoro）を入れる
        if: matrix.lang == 'en'
        run: pip install --quiet kokoro-onnx soundfile

      - name: Kokoro のモデルを用意する（2回目からはキャッシュ）
        if: matrix.lang == 'en'
        id: kokoro
        uses: actions/cache@v4
        with:
          path: short/kokoro
          key: kokoro-model-v1.0

      - name: Kokoro のモデルを落とす
        if: matrix.lang == 'en' && steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p short/kokoro
          curl -sSL -o short/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o short/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la short/kokoro

      - name: VOICEVOX が起きるのを待つ
        if: matrix.lang != 'en'
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 3 http://127.0.0.1:50021/version; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::VOICEVOX ENGINE が起動しませんでした。"
          exit 1

      - name: 動画を作る
        env:
          # 入力はいちど環境変数に移す（コマンド行に直接埋め込まない）
          SET_IN: ${{ needs.plan.outputs.set }}
          LANG_IN: ${{ matrix.lang }}
          MODE_IN: ${{ matrix.mode }}
          VOICEVOX_SPEED: ${{ inputs.speed }}
          VOICEVOX_URL: http://127.0.0.1:50021
          KOKORO_DIR: short/kokoro
        run: |
          export SET_CODE="$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          export VLANG="$LANG_IN" VMODE="$MODE_IN"
          export VTAG="$VLANG"; [ "$VMODE" != "draft" ] && VTAG="$VLANG-$VMODE"
          echo "SET_CODE=$SET_CODE" >> "$GITHUB_ENV"
          echo "VLANG=$VLANG" >> "$GITHUB_ENV"
          echo "VMODE=$VMODE" >> "$GITHUB_ENV"
          echo "VTAG=$VTAG" >> "$GITHUB_ENV"
          if [ ! -f "data/trends/${SET_CODE}_draft.json" ]; then
            echo "::warning::${SET_CODE} の修正版のデータ（data/trends/${SET_CODE}_draft.json）がまだないので、作りません。先に「データ｜修正版の集計（手動）」を実行してください。"
            echo "## ${SET_CODE} の ${VLANG} 修正版は作りませんでした（データがまだ無い）" >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          node maintenance/build-short.mjs "$SET_CODE" "$VLANG" "$VMODE"
          {
            echo "## ${SET_CODE} の動画ができました（${VLANG} / ${VMODE}）"
            echo
            echo "下の Artifacts から \`short-${SET_CODE}-${VTAG}\` を落として、中の ${VTAG}.mp4 を確認してから投稿してください。"
            echo
            echo "### 読み上げの台本（読みの確認用）"
            echo
            echo '```'
            node -e 'const s=require("./short/"+process.env.SET_CODE+"/"+process.env.VTAG+"/script.json");for(const x of s)console.log(`${x.kind.padEnd(8)} ${(+x.dur).toFixed(1)}s  ${x.say}\n         ${x.kana||""}`)'
            echo '```'
            echo
            echo "読み違いがあれば short/yomi.json に「表記: 読み（カタカナ）」を足して、もう一度実行してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      # YouTube 用のサムネイル（1080×1920）は build-short.mjs が動画と一緒に作る（short/<SET>/<TAG>.thumbnail.jpg）。
      # 一覧表示で上下が切れても読めるよう、大事なものを中央の帯に寄せた専用の絵。YouTube に上げるときに自動で付け、Artifacts にも入れる
      - name: サムネイルの案内
        if: env.SKIP != '1'
        run: |
          if [ -f "short/$SET_CODE/$VTAG.thumbnail.jpg" ]; then
            echo "サムネイル: short/$SET_CODE/$VTAG.thumbnail.jpg（YouTube に自動で付けます。付かなかったときは Artifacts のこのファイルを Studio で付けてください）" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "short/$SET_CODE/$VTAG.thumbnail-alt.jpg" ]; then
              echo "差し替え用のサムネイル（狙い目の組み合わせ）: Artifacts の $VTAG.thumbnail-alt.jpg（公開するときに、こちらにしたければ Studio で付け替えてください）" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # X・Bluesky に動画そのものを添付するために、動画ファイルを Releases（タグ videos）にも置いておく
      - name: 動画ファイルを Releases に置く
        if: inputs.upload == true && env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "short/$SET_CODE/$VTAG.mp4" "short/$SET_CODE-$VTAG.mp4"
          if ! gh release view videos --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create videos --repo "$GITHUB_REPOSITORY" --title "動画ファイル（配信用）" --notes "「動画を配信」が X・Bluesky に動画を添付するために使うファイル置き場です。自動で更新されます。" || true
          fi
          gh release upload videos "short/$SET_CODE-$VTAG.mp4" --repo "$GITHUB_REPOSITORY" --clobber || echo "::warning::Releases に動画を置けませんでした。配信のときは YouTube のリンクで投稿します。"

      - name: YouTube に非公開で上げる（許可が登録されていれば）
        if: inputs.upload == true && env.SKIP != '1'
        env:
          SITE_URL: https://sealed-workbench.com
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_JA: ${{ secrets.YT_REFRESH_TOKEN_JA }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
        run: |
          node maintenance/youtube-upload.mjs "$SET_CODE" "$VLANG" "$VMODE" | tee yt.log
          if [ -f "short/$SET_CODE/$VTAG.youtube.json" ]; then
            URL=$(node -e 'console.log(require("./short/"+process.env.SET_CODE+"/"+process.env.VTAG+".youtube.json").url)')
            {
              echo
              echo "### YouTube（非公開）"
              echo
              echo "$URL"
              echo
              echo "内容を確認して、YouTube Studio で「公開」にしてください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # サムネイルが YouTube に付かなかったときだけ、画像を Releases（タグ videos）に置き、
      # 実行ページのまとめ・注意の表示・公開のリマインドの Issue から、1 回で開いて保存できるようにする
      - name: 付かなかったサムネイルを受け渡す
        id: thumb
        if: inputs.upload == true && env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          J="short/$SET_CODE/$VTAG.youtube.json"; T="short/$SET_CODE/$VTAG.thumbnail.jpg"
          [ -f "$J" ] && [ -f "$T" ] || exit 0
          [ "$(node -e 'console.log(require(require("path").resolve(process.argv[1])).thumbnailSet === true)' "$J")" = "true" ] && exit 0
          F="$SET_CODE-$VTAG.thumbnail.jpg"; cp "$T" "$F"
          if gh release upload videos "$F" --repo "$GITHUB_REPOSITORY" --clobber; then
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/videos/$F"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "::warning::YouTube にサムネイルが付きませんでした。この画像を Studio で付けてください: $URL"
            {
              echo
              echo "### サムネイルが付きませんでした"
              echo
              echo "画像を開いて保存し、YouTube Studio でこの動画に付けてください。"
              echo
              echo "[サムネイルの画像を開く]($URL)"
              echo
              echo "<img src=\"$URL\" width=\"270\">"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::YouTube にサムネイルが付きませんでした。Artifacts（short-$SET_CODE-$VTAG）の $VTAG.thumbnail.jpg を Studio で付けてください。"
          fi

      # 公開と「動画を配信」を忘れないように、担当者に割り当てた Issue を立てる（GitHub がメールとアプリで知らせる）
      - name: 公開のリマインドを Issue にする
        if: inputs.upload == true && env.SKIP != '1'
        uses: actions/github-script@v7
        env:
          THUMB_URL: ${{ steps.thumb.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const p = `short/${process.env.SET_CODE}/${process.env.VTAG}.youtube.json`;
            if(!fs.existsSync(p)) return;
            const v = JSON.parse(fs.readFileSync(p, 'utf8'));
            const label = `${process.env.SET_CODE} ${process.env.VLANG} ${process.env.VMODE}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `【要対応】動画の公開と配信：${label}`,
              assignees: [context.repo.owner],
              labels: ['video'],
              body: [
                `動画が YouTube に **非公開** で上がりました。`,
                ``,
                `- 動画: ${v.shortsUrl || v.url}`,
                `- タイトル: ${v.title}`,
                ``,
                `## やること`,
                `1. 動画を開いて内容を確認する`,
                ...(process.env.THUMB_URL ? [`2. サムネイルが自動で付かなかったので、[この画像](${process.env.THUMB_URL})を保存して、YouTube Studio でこの動画に付ける`] : []),
                `${process.env.THUMB_URL ? 3 : 2}. YouTube Studio → コンテンツ → この動画の公開設定を「公開」にする`,
                `${process.env.THUMB_URL ? 4 : 3}. Actions「ショート｜2 動画を配信」を入力なしで実行する（セット別ページに載り、X・Bluesky に案内が出る）`,
                ``,
                `配信が済むとこの Issue は自動で閉じます。`
              ].join('\n')
            });

      - name: 動画の記録をコミット
        if: inputs.upload == true && env.SKIP != '1'
        run: |
          if [ -n "$(git status --porcelain -- data/videos assets/video data/names)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # 無いフォルダを git add に渡すと失敗するので、あるものだけ足す
            # （data/videos = 動画の記録、assets/video = サイト用サムネイル、data/names = 日本語名）
            for p in data/videos assets/video data/names; do
              [ -e "$p" ] && git add -A -- "$p"
            done
            git commit -m "動画の記録を更新（$SET_CODE $VLANG $VMODE）"
            # 4 本が同時に押し込むことがあるので、少しずつ待ちながら何度か試す
            for i in 1 2 3 4 5 6; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "再試行 $i"; sleep $((5 + RANDOM % 10))
            done
          fi

      - name: 動画を保存する
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ env.SET_CODE }}-${{ env.VTAG }}
          path: |
            short/${{ env.SET_CODE }}/${{ env.VTAG }}.mp4
            short/${{ env.SET_CODE }}/${{ env.VTAG }}.thumbnail.jpg
            short/${{ env.SET_CODE }}/${{ env.VTAG }}.thumbnail-alt.jpg
            short/${{ env.SET_CODE }}/${{ env.VTAG }}/script.json
            short/${{ env.SET_CODE }}/${{ env.VTAG }}.youtube.json
          retention-days: 30
          if-no-files-found: error
