name: 長尺｜2 長尺動画をサイトに載せる（自動・毎日）

# YouTube Studio で長尺の環境まとめ動画を「公開」にすると、自動でサイト（セット別ページ・環境レポート）に載る。
#   ・毎日1回（日本時間の昼）、日本語・英語それぞれのチャンネルの最近の動画から「公開になった長尺」を探して data/long.json に登録する
#     （英語は YT_REFRESH_TOKEN_EN が登録されているとき。題に「Limited Review」を含む動画を探す）
#   ・すぐ載せたいときは、このページの「Run workflow」を押す（入力は不要）
#   ・見つからないときは、セットコードと動画IDを入れて押す（例: set=TMT, video_id=dQw4w9WgXcQ）
# 非公開のままの動画は登録されない（サイトには出ない）。目次は、概要欄の「0:00 はじめに」の行から作る。

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（動画IDを指定するときだけ）"
        required: false
      video_id:
        description: "YouTube の動画ID（自動で見つからないときだけ）"
        required: false
      lang:
        description: "調べる言語（both = 日本語と英語の両方／ja／en。ふだんは both のまま。動画IDを指定するときは、その動画の言語を ja か en で選ぶ）"
        type: choice
        options: [both, ja, en]
        required: false
        default: both

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 公開になった長尺を探して登録する
        env:
          LONG_SET: ${{ inputs.set }}
          LONG_VIDEO_ID: ${{ inputs.video_id }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_JA: ${{ secrets.YT_REFRESH_TOKEN_JA }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          LONG_LANG: ${{ (inputs.lang == 'ja' || inputs.lang == 'en') && inputs.lang || '' }}     # 動画IDを指定したときの、その動画の言語
          LONG_LANGS: ${{ (inputs.lang == 'ja' || inputs.lang == 'en') && inputs.lang || 'ja,en' }} # 自動で探す言語（both なら両方）
        run: node maintenance/sync-long.mjs

      - name: セット別ページを作り直して、変わっていればコミットする
        run: |
          # 登録に変更が無くても、ページの作り方（build-set-pages.mjs）を直したあとに押せば、反映される
          node maintenance/build-set-pages.mjs
          # 原因をすぐ見分けられるように、状況をログに出す
          echo "--- 診断 ---"
          echo "data/long.json: $( [ -f data/long.json ] && grep -o '"[A-Z0-9]*": {' data/long.json | tr -d '\":{ ' | tr '\n' ' ' || echo 無し )"
          echo "build-set-pages.mjs が長尺に対応: $(grep -c 'function longSection' maintenance/build-set-pages.mjs) （1なら対応済み、0なら古い版）"
          echo "reports.html が長尺に対応: $(grep -c 'renderLong' reports.html) （1以上なら対応済み）"
          echo "作り直した sets の長尺の枠: $(grep -l 'class=\"longvideo\"' sets/*.html 2>/dev/null | tr '\n' ' ')"
          echo "------------"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/long.json data/names sets; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          if git diff --staged --quiet; then
            echo "変更はありません。"; exit 0
          fi
          git status --short | head -20
          git commit -m "長尺動画をサイトに載せる"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then ok=1; break; fi
            echo "再試行 $i"; sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::error::GitHub に反映（push）できませんでした。もう一度実行してください。"; exit 1; fi
