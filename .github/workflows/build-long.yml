name: 長尺｜1 長尺動画を作る（自動・ショートの2週間後）

# 「〇〇環境まとめ」の横長動画（1920×1080、3〜5分）を、集計済みのデータから作る。日本語版と英語版は、別々のジョブ（別のマシン）で並行して作る。
#   ・言語（lang）: both = 日本語と英語を同時に（別々のジョブ）／ ja = 日本語だけ ／ en = 英語だけ。片方が失敗しても、もう片方はそのまま完成する。
#   ・日本語: ナレーションは VOICEVOX（ずんだもん）。英語: ナレーションは Kokoro（英語の音声）。どちらもずんだもんの立ち絵つき。動画の最後にクレジットが入る
#   ・背景のプレイ映像は Releases のタグ assets にある bg.mp4（無ければ紺色）
#   ・ドラフトとシールドの記事データ（data/articles）と勝率一覧（data/ratings）が両方そろっているセットだけ作れる
# できた動画・目次（chapters.txt）・概要欄の下書き（description.txt）は、この実行ページの「Artifacts」から ZIP で落とせる（30日で消える）。
#   Artifacts の名前: 日本語は long-<SET>、英語は long-<SET>-en
# ショート動画の公開から2週間後に、自動でも作られる（long-reminder.yml。lang は both）。できたら YouTube に「非公開」で自動的に上げる（許可が登録されていれば）。内容を確認して、YouTube Studio で手で「公開」にする。

on:
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: TMT）"
        required: true
      lang:
        description: "作る言語（both = 日本語と英語を別々のジョブで同時に／ja／en）"
        type: choice
        options: [both, ja, en]
        required: false
        default: both
      speed:
        description: "日本語の読み上げの速さ（1.2 = 少し速め。長すぎるときは上げる）"
        required: false
        default: "1.2"
      upload:
        description: "できたら YouTube に非公開で上げる（許可が登録されていれば。公開は YouTube Studio で手で）"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  long-ja:
    name: 日本語版
    if: ${{ inputs.lang != 'en' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu22.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg と画像合成ライブラリを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          npm install --no-save sharp

      - name: 背景のプレイ映像を Releases から落とす
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p short
          if gh release download assets --repo "$GITHUB_REPOSITORY" --pattern bg.mp4 --dir short --clobber; then
            ls -la short/bg.mp4
          else
            echo "::warning::Releases（タグ assets）に bg.mp4 が無いので、紺色の背景で作ります。"
          fi

      - name: VOICEVOX が起きるのを待つ
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 3 http://127.0.0.1:50021/version; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::VOICEVOX ENGINE が起動しませんでした。"
          exit 1

      - name: 動画を作る
        env:
          SET_IN: ${{ inputs.set }}
          VOICEVOX_SPEED: ${{ inputs.speed }}
          VOICEVOX_URL: http://127.0.0.1:50021
        run: |
          export SET_CODE="$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          echo "SET_CODE=$SET_CODE" >> "$GITHUB_ENV"
          for f in "data/articles/${SET_CODE}_draft.json" "data/articles/${SET_CODE}_sealed.json" "data/ratings/${SET_CODE}_PremierDraft.json" "data/ratings/${SET_CODE}_Sealed.json"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f がまだありません。勝率データ集計が終わってから作ってください。"
              exit 1
            fi
          done
          node maintenance/build-long.mjs "$SET_CODE" 2>&1 | grep --line-buffered -v onnxruntime | tee long.log
          test -f "long/${SET_CODE}/ja.mp4"
          {
            echo "## ${SET_CODE} の長尺動画（日本語版）ができました"
            echo
            echo "下の Artifacts から \`long-${SET_CODE}\` を落として、ja.mp4 を確認してください。目次は chapters.txt、概要欄の下書きは description.txt です。"
            echo
            echo "### 長さと目次"
            echo
            echo '```'
            sed -n '/^目次:/,$p' long.log
            echo '```'
            echo
            echo "### 読み上げの台本"
            echo
            echo '```'
            node -e 'const s=require("./long/"+process.env.SET_CODE+"/script.json");let t=0;for(const x of s){t+=+x.dur;console.log(`${x.kind.padEnd(8)} ${(+x.dur).toFixed(1)}s  ${x.say}\n         ${x.kana||""}`)}console.log("\n読み上げ合計 "+t.toFixed(0)+" 秒")'
            echo '```'
            echo
            echo "読み違いがあれば short/yomi.json に「表記: 読み（カタカナ）」を足して、もう一度実行してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: YouTube に非公開で上げる（許可が登録されていれば）
        if: inputs.upload == true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_JA: ${{ secrets.YT_REFRESH_TOKEN_JA }}
        run: |
          set -eo pipefail   # 上げるのに失敗したら、この手順を赤くして止める（tee を通しても失敗を見逃さない）
          node maintenance/youtube-upload-long.mjs "$SET_CODE" | tee yt.log
          if [ -f "long/${SET_CODE}/youtube.json" ]; then
            URL=$(node -e 'console.log(require("./long/"+process.env.SET_CODE+"/youtube.json").url)')
            {
              echo
              echo "### YouTube（日本語版・非公開）"
              echo
              echo "$URL"
              echo
              echo "内容を確認して、YouTube Studio で「公開」にしてください。サムネイルが付かなかった場合は、Artifacts の thumbnail.jpg を Studio で付けてください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 動画を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ env.SET_CODE }}
          path: |
            long/${{ env.SET_CODE }}/ja.mp4
            long/${{ env.SET_CODE }}/chapters.txt
            long/${{ env.SET_CODE }}/description.txt
            long/${{ env.SET_CODE }}/thumbnail.jpg
            long/${{ env.SET_CODE }}/title.txt
            long/${{ env.SET_CODE }}/youtube.json
            long/${{ env.SET_CODE }}/script.json
          retention-days: 30
          if-no-files-found: warn

  long-en:
    name: 英語版
    if: ${{ inputs.lang != 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg と画像合成ライブラリを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          npm install --no-save sharp

      - name: 背景のプレイ映像を Releases から落とす
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p short
          if gh release download assets --repo "$GITHUB_REPOSITORY" --pattern bg.mp4 --dir short --clobber; then
            ls -la short/bg.mp4
          else
            echo "::warning::Releases（タグ assets）に bg.mp4 が無いので、紺色の背景で作ります。"
          fi

      - name: 英語の読み上げ（Kokoro）を入れる
        run: pip install --quiet kokoro-onnx soundfile

      - name: Kokoro のモデルを用意する（2回目からはキャッシュ）
        id: kokoro
        uses: actions/cache@v4
        with:
          path: short/kokoro
          key: kokoro-model-v1.0

      - name: Kokoro のモデルを落とす
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p short/kokoro
          curl -sSL -o short/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o short/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la short/kokoro

      - name: 動画を作る
        env:
          SET_IN: ${{ inputs.set }}
          KOKORO_DIR: short/kokoro
        run: |
          export SET_CODE="$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          echo "SET_CODE=$SET_CODE" >> "$GITHUB_ENV"
          for f in "data/articles/${SET_CODE}_draft.json" "data/articles/${SET_CODE}_sealed.json" "data/ratings/${SET_CODE}_PremierDraft.json" "data/ratings/${SET_CODE}_Sealed.json"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f がまだありません。勝率データ集計が終わってから作ってください。"
              exit 1
            fi
          done
          node maintenance/build-long.mjs "$SET_CODE" en 2>&1 | grep --line-buffered -v onnxruntime | tee long.log
          test -f "long/${SET_CODE}/en/en.mp4"
          {
            echo "## ${SET_CODE} の長尺動画（英語版）ができました"
            echo
            echo "下の Artifacts から \`long-${SET_CODE}-en\` を落として、en.mp4 を確認してください。目次は chapters.txt、概要欄の下書きは description.txt です。"
            echo
            echo "### 長さと目次"
            echo
            echo '```'
            sed -n '/^目次:/,$p' long.log
            echo '```'
            echo
            echo "### 読み上げの台本"
            echo
            echo '```'
            node -e 'const s=require("./long/"+process.env.SET_CODE+"/en/script.json");let t=0;for(const x of s){t+=+x.dur;console.log(`${x.kind.padEnd(8)} ${(+x.dur).toFixed(1)}s  ${x.say}\n         ${x.kana||""}`)}console.log("\n読み上げ合計 "+t.toFixed(0)+" 秒")'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: YouTube に非公開で上げる（許可が登録されていれば）
        if: inputs.upload == true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
        run: |
          set -eo pipefail   # 上げるのに失敗したら、この手順を赤くして止める（tee を通しても失敗を見逃さない）
          node maintenance/youtube-upload-long.mjs "$SET_CODE" en | tee yt.log
          if [ -f "long/${SET_CODE}/en/youtube.json" ]; then
            URL=$(node -e 'console.log(require("./long/"+process.env.SET_CODE+"/en/youtube.json").url)')
            {
              echo
              echo "### YouTube（英語版・非公開）"
              echo
              echo "$URL"
              echo
              echo "内容を確認して、YouTube Studio で「公開」にしてください。サムネイルが付かなかった場合は、Artifacts の thumbnail.jpg を Studio で付けてください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 動画を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ env.SET_CODE }}-en
          path: |
            long/${{ env.SET_CODE }}/en/en.mp4
            long/${{ env.SET_CODE }}/en/chapters.txt
            long/${{ env.SET_CODE }}/en/description.txt
            long/${{ env.SET_CODE }}/en/thumbnail.jpg
            long/${{ env.SET_CODE }}/en/title.txt
            long/${{ env.SET_CODE }}/en/youtube.json
            long/${{ env.SET_CODE }}/en/script.json
          retention-days: 30
          if-no-files-found: warn
