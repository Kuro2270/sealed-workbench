name: SNS｜SNS 定期投稿（自動・週1）

# 毎週金曜 12:00（日本時間）に、最新セットの話題を X と Bluesky に投稿する。
# 手動実行では、種類（test / weekly / monthly）と言語を選べる。まず test で動作確認する。

on:
  schedule:
    - cron: "0 3 * * 5"        # 金曜 03:00 UTC = 12:00 JST
  workflow_dispatch:
    inputs:
      kind:
        description: "投稿の種類"
        type: choice
        options: [test, weekly, monthly]
        default: test
      lang:
        description: "投稿する言語（both = 日本語と英語の両方／ja／en）"
        type: choice
        options: [both, ja, en]
        default: both
      bsky_langs:
        description: "Bluesky に出す言語（既定は en だけ）"
        default: "en"
      theme:
        description: "週次の話題（auto=週ごとに自動）"
        type: choice
        options: [auto, commons, uncommons, pairs, speed]
        default: auto
      dry_run:
        description: "文面の確認だけ（投稿しない）"
        type: boolean
        default: false

permissions:
  contents: write        # カード名・カード画像の一覧を取り直したとき、リポジトリに戻すため

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 画像合成ライブラリを入れる
        run: npm install --no-save sharp

      - name: 投稿
        env:
          SITE_URL: https://sealed-workbench.com
          LANGS: ${{ (inputs.lang == 'ja' || inputs.lang == 'en') && inputs.lang || 'ja,en' }}
          BSKY_LANGS: ${{ inputs.bsky_langs || 'en' }}
          THEME: ${{ inputs.theme != 'auto' && inputs.theme || '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node maintenance/post-social.mjs "${{ inputs.kind || 'weekly' }}"

      - name: 確認用の画像を保存（文面の確認だけのとき）
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: social-preview
          path: social-preview-*.jpg
          if-no-files-found: ignore

      # 投稿の途中で data/names/<SET>.json を取り直すことがある。
      # 戻しておかないと毎回 Scryfall を引き直すことになるので、変わっていれば押し戻す。
      - name: カード名・カード画像の更新を戻す
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/names || true
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
            exit 0
          fi
          git commit -m "カード名・カード画像の一覧を更新"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "押し戻せませんでした（投稿自体は終わっています）"
