name: 勝率データ集計

on:
  schedule:
    - cron: "0 18 5 * *"      # 毎月6日 03:00（日本時間）
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: HOB）。空なら既定の組み合わせ"
        required: false
      format:
        description: "イベント種別（例: PremierDraft）"
        required: false
        default: PremierDraft

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 集計を実行
        id: build
        run: |
          set +e
          if [ -n "${{ inputs.set }}" ]; then
            node maintenance/build-ratings.mjs "${{ inputs.set }}" "${{ inputs.format }}"
          else
            node maintenance/build-ratings.mjs
          fi
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: 環境レポートを作る
        if: steps.build.outputs.status == '0'
        run: node maintenance/build-articles.mjs

      - name: セット別ページを作る
        if: steps.build.outputs.status == '0'
        env:
          SITE_URL: https://sealed-workbench.com
        run: node maintenance/build-set-pages.mjs

      - name: 日本語フォントを入れる
        if: steps.build.outputs.status == '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk librsvg2-bin

      - name: SEOファイルとOGP画像を作る
        if: steps.build.outputs.status == '0'
        env:
          SITE_URL: https://sealed-workbench.com
        run: |
          node maintenance/build-seo.mjs
          node maintenance/build-ogp.mjs
          for l in ja en; do
            if [ -f "ogp-$l.svg" ]; then
              rsvg-convert -w 1200 -h 630 -o "ogp-$l.png" "ogp-$l.svg" && rm -f "ogp-$l.svg"
            fi
          done

      - name: 告知文案を作る
        id: announce
        if: steps.build.outputs.status == '0'
        env:
          SITE_URL: https://sealed-workbench.com
        run: |
          node maintenance/build-announce.mjs
          if [ -f announce.md ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi

      - name: 変更をコミット
        if: steps.build.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings data/articles data/names sets sitemap.xml robots.txt ogp-ja.png ogp-en.png data/announced.json || true
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
            exit 0
          fi
          git commit -m "勝率データを更新"
          # 実行中に他の更新が入っていても押し戻せるよう、最新を取り込んでから押す
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "再試行 $i"
            sleep 5
          done
          echo "プッシュに失敗しました。"
          exit 1

      - name: 告知文案を Issue にする
        if: steps.announce.outputs.has == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('announce.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `告知文案 ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['announce']
            });

      - name: 失敗したら Issue を作る
        if: steps.build.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `勝率データの集計に失敗 ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `集計処理が失敗しました。実行ログを確認してください。\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['maintenance']
            });
