name: 勝率データ集計

on:
  schedule:
    - cron: "0 18 5 * *"      # 毎月6日 03:00（日本時間）
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: HOB）。空なら既定の組み合わせ"
        required: false
      format:
        description: "イベント種別（例: PremierDraft）"
        required: false
        default: PremierDraft

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 集計を実行
        id: build
        run: |
          set +e
          if [ -n "${{ inputs.set }}" ]; then
            node maintenance/build-ratings.mjs "${{ inputs.set }}" "${{ inputs.format }}"
          else
            node maintenance/build-ratings.mjs
          fi
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: 変更をコミット
        if: steps.build.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "勝率データを更新"
            git push
          fi

      - name: 失敗したら Issue を作る
        if: steps.build.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `勝率データの集計に失敗 ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `集計処理が失敗しました。実行ログを確認してください。\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['maintenance']
            });
