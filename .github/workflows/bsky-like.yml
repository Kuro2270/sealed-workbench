name: SNS｜Bluesky のいいね（自動・毎日・テスト運用）

# Bluesky で、MTGアリーナ・マジック：ザ・ギャザリングについての最近の投稿（英語・日本語）を探して、いいねを付ける。
# 1日（日本時間）に付けるのは上限まで（手で付けたいいねも数に入る）。役割はこれだけで、投稿はしない。
# 上限の変え方：Settings → Secrets and variables → Actions → Variables に「BSKY_LIKE_LIMIT」（例: 10）を登録・編集する。
#   登録が無ければ 10 件。50 件より大きい数は 50 件として扱う。
# いいねとの間は「75 秒 ＋ 10 秒〜3 分のランダム」あける（10 件で 25 分ほど）。付けたいいねは、実行結果の Summary に一覧で出る。
# 止めるとき：Actions の画面でこのワークフローを開き、右上の「…」→「Disable workflow」。
# 手で押すときは「候補を見るだけ」にすると、いいねを付けずに候補だけ見られる。
# 手で押して付けるときは、今日すでに付けた数に関係なく、指定の件数（空なら設定の値）まで付ける。毎日の自動実行だけが1日の上限を守る。

on:
  schedule:
    - cron: "43 11 * * *"      # 毎日 20:43（日本時間）。投稿が多い夜に
  workflow_dispatch:
    inputs:
      dry_run:
        description: "候補を見るだけ（いいねは付けない）"
        type: boolean
        default: true
      limit:
        description: "今回付ける件数（最大50。今日の件数に関係なく付ける）。空なら設定（BSKY_LIKE_LIMIT）の値"
        default: ""

permissions:
  contents: read

concurrency:
  group: bsky-like
  cancel-in-progress: false

jobs:
  like:
    runs-on: ubuntu-latest
    timeout-minutes: 240    # 間をあけるので、上限 50 件（最長で3時間半ほど）でも収まるように
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: いいねを付ける
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          LIKE_LIMIT: ${{ inputs.limit || vars.BSKY_LIKE_LIMIT || '10' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node maintenance/bsky-like.mjs
