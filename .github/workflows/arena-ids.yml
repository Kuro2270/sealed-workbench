name: データ｜アリーナのカード番号（自動・毎日）

# MTGアリーナのカード番号 → カード名 の対応表（data/arena-ids.json）を、17Lands のカード一覧から作る。役割はこれだけ。
#   ・ドラフト補助・シールド補助が、Scryfall にまだ番号が登録されていない新しいセットでも、カードを特定できるようにするため
#     （2026年10月 FRA で、配信から2週間以上たっても Scryfall に番号が無く、補助ツールに番号だけが並んだ）
#   ・中身が変わったときだけ commit する
# 手で押すときは、入力は不要。

on:
  schedule:
    - cron: "10 18 * * *"      # 毎日 3:10（日本時間）。新データの点検（3:30）の前
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-ids
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 対応表を作る
        run: node maintenance/build-arena-ids.mjs

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arena-ids.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変わったものはありません。"
            exit 0
          fi
          git commit -m "アリーナのカード番号の対応表を更新"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "押し戻せませんでした" && exit 1
