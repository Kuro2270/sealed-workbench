name: セット名を登録

# 新セットの日本語名を i18n.js の SET_JA に足して、そのまま commit する。
# 「メンテナンス点検」の Issue で未登録を知らされたら、ここから登録する。
# 日本語名は機械的に取れる元が無いので、ここだけは人が入れる（公式サイトの表記を確認して）。

on:
  workflow_dispatch:
    inputs:
      code:
        description: "セットコード（例: fra）"
        required: true
      name:
        description: "日本語の正式名称（例: リアリティ・フラクチャー）"
        required: true

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: SET_JA に追記
        env:
          # 入力は環境変数に移す（コマンド行に直接埋め込まない）
          CODE: ${{ inputs.code }}
          NAME: ${{ inputs.name }}
        run: |
          CODE="$(echo "$CODE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          node maintenance/check-sets.mjs --add "$CODE=$NAME"

      - name: 変更をコミット
        env:
          CODE: ${{ inputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n.js
          if git diff --staged --quiet; then
            echo "変更はありませんでした（すでに登録済みの可能性）。"
            exit 0
          fi
          git commit -m "セット名を登録: $CODE"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "再試行 $i"
            sleep 5
          done
          echo "プッシュに失敗しました。"
          exit 1
