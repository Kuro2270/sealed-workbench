name: データ｜暫定版の勝率（自動・毎日）

# 公開データセットがまだ出ていない新セットについて、17Lands の毎日の集計から「暫定版」の環境レポートを作る。
#   ・毎日見に行くが、作るのは2回だけ（build-provisional.mjs が決める）：
#       1回目 … MTGアリーナの配信から12日目（17Lands の利用ガイドラインで、サイトへの掲載は12日目から）
#       2回目 … その7日後（1週間分増えたデータで作り直す）
#     そのあとは、確定版（data/articles/<SET>_<mode>.json）ができるまで作り直さない
#   ・作るもの：data/provisional/<SET>_<mode>.json（環境レポートの画面・セット別ページが読む）、data/ratings/<SET>_<mode>.json（勝率一覧・練習ツール・補助）、
#     セット別ページ（sets/<SET>.html。公開データのセットと同じ作り）と、下見の一覧（data/profiles/index.json）の印
#   ・確定版ができたセットの暫定版は、ここで消す。確定版のファイルには触らない
# 役割はこれだけ。確定版は「データ｜2 勝率データ集計」が作る。

on:
  schedule:
    - cron: "23 19 * * *"      # 毎日 4:23（日本時間）。新データの点検（3:30）のあと
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: FRA）。空なら作る日のセットを自動で探す。入れると、そのセットの数字を今の段階のまま作り直す"
        required: false

permissions:
  contents: write

concurrency:
  group: provisional
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 17Lands の毎日の集計から暫定版を作る
        id: prov
        env:
          SET_IN: ${{ inputs.set }}
        run: |
          SET_CODE="$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          SETS="$(node maintenance/build-provisional.mjs "${SET_CODE:---auto}")" || echo "::warning::一部のセット・形式を作れませんでした（ログを確認）"
          echo "sets=$(echo $SETS)" >> "$GITHUB_OUTPUT"

      - name: セット別ページを作り直す
        if: steps.prov.outputs.sets != ''
        env:
          SITE_URL: https://sealed-workbench.com
        run: |
          for S in ${{ steps.prov.outputs.sets }}; do node maintenance/build-set-profile.mjs "$S"; done   # 下見の一覧に、勝率があるセットの印を付ける
          node maintenance/build-set-pages.mjs     # sets/<SET>.html とセット一覧

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for P in data/provisional data/ratings data/profiles data/names sets; do [ -e "$P" ] && git add -A "$P"; done
          if git diff --staged --quiet; then
            echo "変わったものはありません。"
            exit 0
          fi
          git commit -m "暫定版の勝率を更新（${{ steps.prov.outputs.sets }}）"
          for i in 1 2 3; do
            # 作り直したファイル（暫定版・下見）は毎回まるごと作るので、ぶつかったときはこの実行で作ったほうを残す（-X theirs は rebase では「こちら側」）
            git pull --rebase -X theirs --autostash origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "押し戻せませんでした" && exit 1
