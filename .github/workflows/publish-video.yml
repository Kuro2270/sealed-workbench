name: ショート｜2 動画を配信（手動・公開後に押す）

# YouTube Studio で動画を「公開」にしたあとに押す。入力は不要。
#   1) data/videos.json にある「未配信」の動画について、YouTube に公開になっているか確認する
#   2) 公開になっていたものを、セット別ページと環境レポートに載せる（Cloudflare が自動で配信）
#   3) X と Bluesky に「動画を出しました」を投稿する（Bluesky は英語だけ）。動画ファイルが Releases（タグ videos）にあれば動画そのものを添付し、
#      YouTube のリンクは返信に付ける。無ければ今まで通りリンクで投稿する
#   まだ非公開のものは残しておき、次に押したときにまた確認する。
# 動画の ID は「環境まとめ動画を作る」が記録しているので、ふつうは何も入れなくてよい。

on:
  workflow_dispatch:
    inputs:
      set:
        description: "セットコードで絞る（空ならすべての未配信）"
        required: false
      post:
        description: "X・Bluesky に案内を投稿する"
        type: boolean
        default: true
      manual:
        description: "記録に無い動画を足す：「セット 言語 形式 動画ID」（例: HOB ja sealed g7u5JVhJgFk）"
        required: false
      comments:
        description: "配信済みの動画に、付いていないコメント（案内・呼びかけ）を付ける：セットコード（例: SOS）。すべてなら ALL。配信や SNS 投稿はしない"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 画像合成ライブラリを入れる
        run: npm install --no-save sharp

      - name: 公開になった動画を配信する
        env:
          SITE_URL: https://sealed-workbench.com
          ONLY_SET: ${{ inputs.set }}
          MANUAL: ${{ inputs.manual }}
          COMMENTS_FOR: ${{ inputs.comments }}
          POST: ${{ inputs.post == true && '1' || '' }}
          BSKY_LANGS: en
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_JA: ${{ secrets.YT_REFRESH_TOKEN_JA }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node maintenance/publish-videos.mjs

      # X への自動投稿は止めている（X API が従量課金になったため）。文面・画像・動画を Artifacts「x-manual」とこのまとめに出すので、手で X に貼る
      - name: X に手で貼る文面と素材を出す
        if: always()
        run: |
          if [ -f social-manual/x-posts.md ]; then
            { echo "## X に手で投稿する文面（動画・画像は Artifacts「x-manual」から）"; echo; cat social-manual/x-posts.md; } >> "$GITHUB_STEP_SUMMARY"
            mkdir -p social-manual/video
            for f in short/dl/*.mp4; do [ -f "$f" ] && cp "$f" social-manual/video/; done
            echo "HAS_MANUAL=1" >> "$GITHUB_ENV"
          fi
      - name: X 手動投稿の素材を保存する
        if: always() && env.HAS_MANUAL == '1'
        uses: actions/upload-artifact@v4
        with:
          name: x-manual
          path: social-manual/
          retention-days: 14
          if-no-files-found: ignore

      - name: 配信済みのリマインド Issue を閉じる
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if(!fs.existsSync('publish-result.json')) return;
            const { published } = JSON.parse(fs.readFileSync('publish-result.json', 'utf8'));
            if(!published.length) return;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'video', per_page: 100 });
            for(const p of published){
              const label = `${p.set} ${p.lang} ${p.mode}`;
              for(const is of open.filter(i => i.title.includes(label))){
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: is.number, body: `配信しました。 https://www.youtube.com/shorts/${p.id}` });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: is.number, state: 'closed' });
              }
            }

      - name: セット別ページを作り直す
        run: node maintenance/build-set-pages.mjs

      # 先行版（発売直後の速報）が公開になったセットは、まだ環境レポートが無いので、下見ページを作り直して動画を載せる
      - name: 先行版の動画を下見ページに載せる
        run: |
          node -e '
            const v = require("./data/videos.json"); let idx = { articles: [] };
            try{ idx = require("./data/articles/index.json"); }catch(e){}
            const have = new Set((idx.articles || []).map(a => String(a.set).toUpperCase()));
            const out = [];
            for(const [S, langs] of Object.entries(v)){
              if(have.has(S)) continue;
              if(Object.values(langs).some(l => l && l.early && l.early.id && l.early.public)) out.push(S);
            }
            console.log(out.join(" "));
          ' > early-sets.txt
          for S in $(cat early-sets.txt); do
            node maintenance/build-set-profile.mjs "$S" || echo "::warning::$S の下見ページを作り直せませんでした（Scryfall に届かない？）"
          done

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 無いフォルダを git add に渡すと全体が失敗して何も記録されないので、あるものだけ足す
          for p in data/videos.json data/videos assets/video sets data/names data/profiles; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          git status --short | head -20
          if git diff --staged --quiet; then
            echo "::warning::変更はありませんでした（記録が変わっていない）。"
          else
            git commit -m "動画を配信"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "再試行 $i"; sleep 5
            done
          fi
