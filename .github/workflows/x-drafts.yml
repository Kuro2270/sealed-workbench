name: SNS｜X の文案を作る（自動・毎日）

# X に手で投稿する告知の文案を作り、data/social/x-queue/ に置く。X の告知は次の3つのときだけ。
#   1. 新セットで練習ができるようになったとき（「SNS｜新セット発売の告知」の記録）
#   2. 速報のショート（日本語）を公開したとき（「ショート｜2 動画を配信」で公開の印が付いたもの）
#   3. 環境まとめの長尺（日本語）を公開したとき（「長尺｜2 長尺動画をサイトに載せる」で載ったもの）
# 作ったものは data/social/x-drafted.json に記録し、2回は作らない。はじめての実行は、いまある分を記録するだけ。
# 役割は文案を作ることだけ。知らせるのは「SNS｜X 投稿の催促」、投稿は手で行う。

on:
  schedule:
    - cron: "32 3 * * *"       # 毎日 12:32（日本時間）。新セットの告知（12:17）のあと、催促（12:47）の前
  workflow_dispatch:
    inputs:
      dry_run:
        description: "文面の確認だけ（置かない・記録しない）"
        type: boolean
        default: false

permissions:
  contents: write        # 文案と記録をリポジトリに戻すため

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 文案を作る
        env:
          SITE_URL: https://sealed-workbench.com
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node maintenance/x-drafts.mjs

      - name: 文案と記録を戻す
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social || true
          if git diff --staged --quiet; then
            echo "新しい文案はありませんでした。"
            exit 0
          fi
          git commit -m "X の告知の文案を追加"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "押し戻せませんでした" && exit 1
