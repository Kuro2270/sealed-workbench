name: 補助｜動画のサムネイルだけ作る

# すでに公開した動画の、サイト埋め込み用のサムネイル（冒頭のタイトル場面）を作ってページに反映する。
# 「環境まとめ動画を作る」はこれを自動でやるので、ふつうは使わない。昔の動画のサムネイルを後から揃えたいときに。
#   ・読み上げは要らないので、VOICEVOX も Kokoro も使わない（1〜2分で終わる）
#   ・できた画像は assets/video/<SET>-<言語>[-sealed].jpg に置き、セット別ページを作り直す。環境レポートは次の表示から自動で使う
#   ・YouTube 側のサムネイルは変えない（ショートは YouTube Studio から変えられないため）

on:
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: HOB）。空ならすべての公開済み動画"
        required: false

permissions:
  contents: write

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg と画像合成ライブラリを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          npm install --no-save sharp

      - name: 背景のプレイ映像を Releases から落とす
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p short
          gh release download assets --repo "$GITHUB_REPOSITORY" --pattern bg.mp4 --dir short --clobber || echo "::warning::bg.mp4 が無いので紺色の背景で作ります。"

      - name: サムネイルを作る
        env:
          SET_IN: ${{ inputs.set }}
          SHORT_POSTER: "1"
        run: |
          ONLY="$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          # data/videos.json にある公開済みの動画ぶんだけ作る
          node -e '
            const all = require("./data/videos.json");
            for(const S of Object.keys(all)) for(const L of ["ja","en"]){
              let v = all[S][L]; if(!v) continue; if(v.id) v = { draft: v };
              for(const M of ["draft","sealed"]) if(v[M] && v[M].id && v[M].public !== false) console.log(`${S} ${L} ${M}`);
            }' | while read -r S L M; do
            if [ -n "$ONLY" ] && [ "$S" != "$ONLY" ]; then continue; fi
            if [ ! -f "data/articles/${S}_${M}.json" ]; then echo "::warning::${S} ${M} の記事データが無いので飛ばします。"; continue; fi
            echo "== $S $L $M"
            node maintenance/build-short.mjs "$S" "$L" "$M" || echo "::warning::$S $L $M のサムネイルを作れませんでした。"
          done
          ls -la assets/video || true

      - name: セット別ページを作り直す
        run: node maintenance/build-set-pages.mjs

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in assets/video sets data/names; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "動画のサムネイルを更新"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "再試行 $i"; sleep 5
            done
          fi
