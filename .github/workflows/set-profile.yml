name: セットの下見を作る

# 勝率データが出る前の新セット用に、カードの枚数を数えた「下見」ページを作る。
#   sets/<SET>.profile.html（日本語）／ sets/<SET>.profile.en.html（英語）
# 「新データの点検」が毎日、発売前後のセットを見つけて自動で作るので、ふつうは押さなくてよい。
# 作り直したいとき（Scryfall のカード情報が増えたときなど）に、セットコードを入れて押す。

on:
  workflow_dispatch:
    inputs:
      set:
        description: "セットコード（例: FRA）。空なら発売前後のセットを自動で探す"
        required: false

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 下見を作る
        env:
          SET_IN: ${{ inputs.set }}
        run: |
          if [ -n "$SET_IN" ]; then
            node maintenance/build-set-profile.mjs "$(echo "$SET_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')"
          else
            node maintenance/build-set-profile.mjs --auto
          fi
          node maintenance/build-set-pages.mjs
          node maintenance/build-seo.mjs
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sets data/profiles data/names sitemap.xml || true
          if git diff --staged --quiet; then echo "変更はありませんでした。"; exit 0; fi
          git commit -m "セットの下見を更新"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && exit 0; sleep 5; done
          exit 1
