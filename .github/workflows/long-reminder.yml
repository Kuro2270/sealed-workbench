name: 長尺｜1b 自動作成の起動（自動・毎日）

# 新しいセットの長尺動画を、確定版（公開データセット）を待たずに、暫定版（17Lands の毎日の集計）で自動で作り、YouTube に「非公開」で上げる。
# 毎日1回（9:10）、「紙の発売から14〜40日目」で、ドラフトとシールドの材料がそろったセットについて「長尺動画を作る」を始め、確認用の Issue を立てる。
#   ・どのセットが作る日かは long-due.mjs が決める（材料は確定版があれば確定版、無ければ暫定版。14日目なら、ふつうは暫定版）
#   ・同じセットで2回は作らない（Issue の題で確かめる）。確定版が出たあとに作り直すこともしない
#   ・すでにサイトに長尺が載っているセット（data/long.json にある）は作らない
# 公開は自動ではしない。Issue（メール・アプリで通知）を見て、YouTube Studio で内容を確認し、手で「公開」にする。
# 2026年10月までは「確定版の記事データができてから」作っていたが、旬を逃すので、暫定版で14日目に作るように変えた。

on:
  schedule:
    - cron: "10 0 * * *"       # 毎日 09:10（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 作る日が来たセットを選ぶ
        run: node maintenance/long-due.mjs > due.txt

      - name: 長尺を作り始め、確認の Issue を立てる
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const due = fs.readFileSync('due.txt', 'utf8').split('\n').filter(Boolean).map(l => { const [set, released, kind] = l.split('\t'); return { set, released, kind }; });
            if(!due.length) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', labels: 'long', per_page: 100 });
            for(const { set, released, kind } of due){
              const title = `【要確認】長尺動画を作って非公開で上げました：${set}`;
              const oldTitle = `【要対応】長尺動画を作る日です：${set}`;   // 以前の知らせ方で、すでに知らせたセットは自動では作らない
              if(issues.some(i => i.title === title || i.title === oldTitle)) continue;
              // 長尺づくりを始める。始められなかったら Issue は立てず、翌日にまた試す
              try{
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'build-long.yml', ref: 'main',
                  inputs: { set, upload: 'true' } });
              }catch(e){
                core.warning(`長尺づくりを始められませんでした: ${set} ${e.message}`);
                continue;
              }
              const runs = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/build-long.yml`;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, assignees: [context.repo.owner], labels: ['long'],
                body: [
                  `${set} の長尺（環境まとめ）を、${kind}のデータで自動で作り始めました（1〜2時間ほどかかります）。`,
                  `できあがると YouTube に「非公開」で上がります。公開は自動ではしません。`,
                  ``,
                  `## やること`,
                  `1. 作成の進み具合と結果: ${runs}`,
                  `2. 実行結果の読み上げ台本（読み違い）と、動画の長さ・カード画像を確認する`,
                  `3. 問題なければ YouTube Studio で「公開」にする。「子ども向けではない」になっているかも見る`,
                  `4. 公開すると、翌日までに自動でサイトに載る（すぐ載せたいときは Actions「長尺動画をサイトに載せる」を実行）`,
                  ``,
                  `作成が失敗したときは、GitHub から失敗の通知が届きます。直したうえで Actions「長尺動画を作る」に ${set} を入れて手で実行してください。`,
                  `直したい点があれば、同じ手順で作り直せます（古い非公開動画は YouTube Studio で削除してください）。`,
                  ``,
                  `材料: ${kind}（発売 ${released}）`
                ].join('\n')
              });
            }
