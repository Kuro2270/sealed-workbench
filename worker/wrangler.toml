name = "sealed-workbench-table"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# 部屋ごとに1つできる入れ物。盤面の正本をここが持つ。
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 無料プランで使えるのは SQLite 方式だけなので、必ず new_sqlite_classes で登録する
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
