<!DOCTYPE html>
<html lang="ja" data-title="page.guide.title" data-desc="desc.guide">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — MTG Arena Limited practice</title>
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MTG Arena Limited Workbench">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="./i18n.js"></script>
<script src="./analytics.js"></script>
<style>
  :root{
    --pine:#10304F; --pine-deep:#0A2038;
    --paper:#F5F8FC; --paper-2:#E8EEF6;
    --ink:#0D1B2A; --muted:#5C7185;
    --gold:#2F7DF6; --line:#D3DFEB;
    --radius:8px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  /* 内容の長さでスクロールバーが出たり消えたりしても、位置が動かないようにする */
  html{overflow-y:scroll;scrollbar-gutter:stable}
  body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.85}
  h1,h2{font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.2}

  header{background:linear-gradient(135deg,var(--pine-deep) 0%,var(--pine) 55%,#17466F 100%);color:var(--paper);padding:24px 24px 16px;border-bottom:3px solid var(--gold);box-shadow:0 10px 30px -18px rgba(8,26,48,.9)}
  .wrap{max-width:1180px;margin:0 auto}
  .head-top{display:block}
  .brand{font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;font-size:17px;font-weight:700;letter-spacing:.04em;color:#9CC8FF;line-height:24px;margin:0 0 12px}

  /* 言語の切り替えは、どのページでも見出しの右上に置く */
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
  .brandrow .brand{margin:0}
  select.langsel{min-width:112px;padding:6px 10px;font-size:13px}
  header h1{font-size:24px;margin:0}
  header p{margin:6px 0 0;color:#A9C2DE;font-size:13px;line-height:1.55;max-width:80ch;min-height:41px}
  nav{margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px}
  nav a{
    display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;
    font-size:13px;font-weight:500;line-height:1;white-space:nowrap;
    color:#C6D9EE;text-decoration:none;background:rgba(255,255,255,.05);
    border:1px solid #2C4D74;transition:background .12s,color .12s;
  }
  nav a:hover{background:#1A4A79;color:var(--paper);border-color:#2F5E8F}
  nav a.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF;font-weight:700}

  /* ナビはカテゴリごとにまとめる。小さな見出しを付けて、探す場所を分かりやすくする */
  nav{margin:0 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
  .ng{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:16px;border-left:1px solid rgba(255,255,255,.16)}
  .ng:first-of-type{padding-left:0;border-left:none}
  .ngl{width:100%;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#8FA9C6;margin:0 0 1px;text-transform:uppercase}
  @media (max-width:760px){
    .ng{padding-left:0;border-left:none;width:100%}
  }
  .controls{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select{background:var(--pine-deep);color:var(--paper);border:1px solid #2C4D74;padding:9px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px;min-width:120px}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  main{max-width:760px;margin:0 auto;padding:26px 24px 70px}
  section{margin-bottom:34px}
  h2{font-size:19px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  p{margin:0 0 14px}
  ol{margin:0 0 14px;padding-left:1.4em}
  ol li{margin-bottom:5px}
  a{color:#1E7A52}

  h3.cat{font-size:15px;margin:22px 0 4px;color:var(--pine)}
  h3.cat:first-of-type{margin-top:14px}
  .catlead{margin:0 0 10px;color:var(--muted);font-size:13px}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 6px}
  .tool{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .tool h4{margin:0 0 6px;font-size:15px;font-family:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif}
  .tool h4 a{color:var(--gold);text-decoration:none}
  .tool h4 a:hover{text-decoration:underline}
  .tool p{margin:0 0 8px;font-size:13px;line-height:1.75}
  .tool p:last-child{margin:0}
  /* 語句の補足。ふだんは隠しておき、カーソルを合わせたとき（スマホでは押したとき）だけ出す */
  .term{position:relative;border-bottom:1px dashed var(--gold);cursor:help;outline:none;white-space:nowrap}
  .term .pop{position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:min(420px,78vw);white-space:normal;
             background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
             box-shadow:0 14px 34px -14px rgba(13,27,42,.45);font-size:12.5px;line-height:1.75;color:var(--ink);
             opacity:0;visibility:hidden;transition:opacity .12s}
  .term:hover .pop,.term:focus .pop,.term:focus-within .pop{opacity:1;visibility:visible}
  @media (max-width:720px){ .tools{grid-template-columns:1fr} .term .pop{left:auto;right:0} }
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .cta a{
    display:inline-block;background:var(--gold);color:#FFFFFF;font-weight:700;
    text-decoration:none;padding:10px 18px;border-radius:var(--radius);font-size:14px;
  }
  .cta a:hover{background:#1F6AE0}

  footer{max-width:760px;margin:0 auto;padding:0 24px 50px;color:var(--muted);font-size:11.5px;line-height:1.9}
  footer a{color:var(--muted)}

  /* ---------- スマートフォン ---------- */
  @media (max-width:720px){
    header p{min-height:0}
    html,body{overflow-x:hidden}
    body{font-size:14px}
    header{padding:16px 14px 12px}
    header h1{font-size:20px}
    header p{font-size:12px;max-width:none}
    main{padding:18px 14px 50px}
    footer{padding:0 14px 40px}
    .head-top{flex-direction:column;align-items:stretch;gap:12px}
    .controls select{width:100%}
    nav{margin:0 0 14px;gap:6px;font-size:12px}
    nav a{white-space:nowrap}
    .cta a{flex:1 1 100%;text-align:center}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="brand" data-i18n="site.name">MTGアリーナ リミテッド・ワークベンチ</div>
      <select id="langSelect" class="langsel" data-i18n-label="lang.label"><option value="ja">日本語</option><option value="en">English</option></select>
    </div>
    <nav>
      <div class="ng"><span class="ngl" data-i18n="navgrp.start">はじめに</span>
        <a href="./guide.html" class="on" data-i18n="nav.guide">使い方</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.build">デッキを作る</span>
        <a href="./" data-i18n="nav.sealed">シールド構築</a>
        <a href="./draft.html" data-i18n="nav.draft">ドラフト構築</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.assist">補助</span>
        <a href="./assistant.html" data-i18n="nav.assist">ドラフト補助</a>
        <a href="./sealed-assist.html" data-i18n="nav.sassist">シールド補助</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.data">データを見る</span>
        <a href="./reports.html" data-i18n="nav.reports">環境レポート</a></div>
      <div class="ng"><span class="ngl" data-i18n="navgrp.play">対戦する</span>
        <a href="./table.html" data-i18n="nav.table">対戦卓</a>
        <a href="./swiss.html" data-i18n="nav.swiss">スイスドロー</a></div>
    </nav>
    <div class="head-top">
      <div>
        <h1 data-i18n="guide.h1">使い方</h1>
        <p data-i18n="guide.lead">このサイトで何ができるのか、実際にアリーナで遊ぶまでの流れをまとめます。</p>
      </div>
      <div class="controls">
      </div>
    </div>
  </div>
</header>

<main>
  <section>
    <h2 data-i18n="guide.s0.h">このサイトの目的</h2>
    <div data-i18n-html="guide.s0.body"></div>
  </section>

  <section>
    <h2 data-i18n="guide.tools.h">できること</h2>

    <h3 class="cat" data-i18n="navgrp.build">デッキを作る</h3>
    <p class="catlead" data-i18n-html="guide.cat.build"></p>
    <div class="tools">
      <div class="tool">
        <h4><a href="./" data-i18n="nav.sealed">シールド構築</a></h4>
        <p data-i18n="guide.t.sealed"></p>
      </div>
      <div class="tool">
        <h4><a href="./draft.html" data-i18n="nav.draft">ドラフト構築</a></h4>
        <p data-i18n="guide.t.draft"></p>
      </div>
      <div class="tool">
        <h4><a href="./assistant.html" data-i18n="nav.assist">ドラフト補助</a></h4>
        <p data-i18n="guide.t.assist"></p>
      </div>
    </div>

    <h3 class="cat" data-i18n="navgrp.data">データを見る</h3>
    <p class="catlead" data-i18n-html="guide.cat.data"></p>
    <div class="tools">
      <div class="tool">
        <h4><a href="./reports.html" data-i18n="nav.reports">環境レポート</a></h4>
        <p data-i18n-html="guide.t.reports"></p>
      </div>
    </div>

    <h3 class="cat" data-i18n="navgrp.play">対戦する</h3>
    <p class="catlead" data-i18n-html="guide.cat.play"></p>
    <div class="tools">
      <div class="tool">
        <h4><a href="./table.html" data-i18n="nav.table">対戦卓</a></h4>
        <p data-i18n="guide.t.table"></p>
      </div>
      <div class="tool">
        <h4><a href="./swiss.html" data-i18n="nav.swiss">スイスドロー</a></h4>
        <p data-i18n="guide.t.swiss"></p>
      </div>
    </div>
  </section>


  <section>
    <h2 data-i18n="guide.s6.h">よくある質問</h2>
    <div data-i18n-html="guide.s6.body"></div>
  </section>
</main>

<footer>
  <span data-i18n-html="foot.short">データの出典・権利表示、および当サイトの内容を引用する際のお願いは<a href="./privacy.html">プライバシーポリシー</a>にまとめています。</span>
</footer>

<script>
const sel = document.getElementById("langSelect");
sel.value = I18N.lang;
sel.onchange = e => I18N.set(e.target.value);

/* 語句の補足を差し込む。言語を切り替えたときは入れ直す */
function fillPops(){
  document.querySelectorAll("[data-pop]").forEach(el => {
    const old = el.querySelector(".pop");
    if(old) old.remove();
    const box = document.createElement("span");
    box.className = "pop";
    box.innerHTML = t("guide.pop." + el.dataset.pop);
    el.appendChild(box);
  });
}
document.addEventListener("DOMContentLoaded", fillPops);
I18N.onChange(() => { sel.value = I18N.lang; fillPops(); });
</script>
</body>
</html>
